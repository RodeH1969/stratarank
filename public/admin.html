const { useState, useEffect, useMemo, useRef } = React;

const BCCM_MODULES = [
  "Standard Module",
  "Accommodation Module",
  "Commercial Module",
  "Small Schemes Module",
  "Specified Two-lot Schemes Module",
];

const emptyData = { managers: [], schemes: [], events: [], sponsors: [], sponsorInvites: [], agencyLogos: {}, seasonYear: new Date().getFullYear() };
const schemeLabel = (scheme) => {
  if (!scheme) return "Building";
  const parts = [scheme.suburb, scheme.planType, scheme.module, scheme.lotCount ? `${scheme.lotCount} lots` : null].filter(Boolean);
  return parts.length ? parts.join(" · ") : "Building";
};
const brisbaneToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "Australia/Brisbane" });
const mondayOf = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const dow = dt.getUTCDay();
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  dt.setUTCDate(dt.getUTCDate() + diffToMonday);
  return dt.toISOString().slice(0, 10);
};
const weekRangeLabel = (mondayStr) => {
  const [y, m, d] = mondayStr.split("-").map(Number);
  const monday = new Date(Date.UTC(y, m - 1, d));
  const sunday = new Date(Date.UTC(y, m - 1, d + 6));
  const fmt = (dt) => dt.toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: "UTC" });
  return `${fmt(monday)} – ${fmt(sunday)}`;
};
function computePoints(type, newTerm, prevTerm) {
  const t = Number(newTerm);
  const p = prevTerm != null && prevTerm !== "" ? Number(prevTerm) : null;
  if (type === "competitor") {
    if (t === 3) return 10;
    if (t === 2) return 9;
    if (t === 1) return 8;
    return 0;
  }
  if (type === "renewal") {
    if (t === 3) {
      if (p === 1 || p === 2) return 7;
      if (p === 3) return 3;
      return 0;
    }
    if (t === 2) return 2;
    if (t === 1) return 1;
    return 0;
  }
  return 0;
}

async function api(path, options) {
  // Render's containers occasionally take a minute or two to fully settle
  // right after a fresh deploy, which can cause a brief run of server-side
  // failures. Retry those silently with backoff before ever surfacing an
  // error — but never retry a genuine validation error (4xx), since that's
  // real input feedback the person needs to see immediately.
  const maxAttempts = 6;
  let delay = 2000;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    let res;
    try {
      res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options && options.headers) },
      });
    } catch (networkErr) {
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay * 2, 20000);
        continue;
      }
      throw networkErr;
    }
    const body = await res.json().catch(() => ({}));
    if (res.ok) return body;
    const message = body.error || `Request failed (${res.status})`;
    if (res.status >= 500 && attempt < maxAttempts) {
      await new Promise((r) => setTimeout(r, delay));
      delay = Math.min(delay * 2, 20000);
      continue;
    }
    throw new Error(message);
  }
}

function InfoTooltip({ text }) {
  const [open, setOpen] = useState(false);
  return (
    <span className="relative inline-flex align-middle ml-1">
      <button
        type="button"
        onClick={() => setOpen((o) => !o)}
        onBlur={() => setOpen(false)}
        aria-label="More info"
        className="w-4 h-4 rounded-full bg-slate-300 text-white text-[10px] font-bold leading-none flex items-center justify-center hover:bg-slate-400"
      >
        i
      </button>
      {open && (
        <div className="absolute z-20 left-1/2 -translate-x-1/2 top-full mt-2 w-60 bg-slate-900 text-white text-xs rounded-lg p-3 shadow-lg">
          {text}
        </div>
      )}
    </span>
  );
}

function AgencyLogoManager({ data, refresh }) {
  const [editingKey, setEditingKey] = useState(null); // null = adding a new one
  const [agencyName, setAgencyName] = useState("");
  const [logoData, setLogoData] = useState("");
  const [logoFileName, setLogoFileName] = useState("");
  const [websiteUrl, setWebsiteUrl] = useState("");
  const [error, setError] = useState(null);

  const agencyLogos = data.agencyLogos || {};

  const resetForm = () => {
    setEditingKey(null);
    setAgencyName(""); setLogoData(""); setLogoFileName(""); setWebsiteUrl("");
  };

  const startEdit = (key, val) => {
    setEditingKey(key);
    setAgencyName(val.name);
    setLogoData(val.logoUrl);
    setLogoFileName("");
    setWebsiteUrl(val.websiteUrl || "");
    setError(null);
  };

  const saveAgencyLogo = async () => {
    if (!agencyName.trim() || !logoData) return;
    try {
      await api("/api/agency-logos", { method: "POST", body: JSON.stringify({ name: agencyName.trim(), logoUrl: logoData, websiteUrl: websiteUrl.trim() }) });
      await refresh();
      resetForm();
    } catch (e) {
      setError(e.message);
    }
  };

  const removeAgencyLogo = async (key) => {
    if (!window.confirm(`Remove logo for ${key}?`)) return;
    try {
      await api(`/api/agency-logos/${encodeURIComponent(key)}`, { method: "DELETE" });
      await refresh();
      if (editingKey === key) resetForm();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <section className="mb-10">
      <h2 className="font-serif text-2xl">Agency Logos</h2>
      <p className="text-sm text-slate-500 mt-1 mb-4">
        Upload corporate logos for manager companies so they appear automatically next to their name on the leaderboard. Add a website and their logo becomes a clickable link.
      </p>

      <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-3 max-w-lg mb-6">
        <Field label="Agency / Company Name">
          <input
            value={agencyName}
            onChange={(e) => setAgencyName(e.target.value)}
            placeholder="e.g. SSKB"
            disabled={!!editingKey}
            className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white disabled:bg-slate-100 disabled:text-slate-500"
          />
          {editingKey && <p className="text-xs text-slate-400 mt-1">To rename an agency, delete it and add it again under the new name.</p>}
        </Field>

        <Field label="Logo Image File">
          <input
            type="file"
            accept="image/png,image/jpeg,image/webp,image/svg+xml"
            onChange={(e) => {
              const file = e.target.files?.[0];
              if (!file) return;
              if (file.size > 2 * 1024 * 1024) {
                window.alert("Please choose a logo smaller than 2 MB.");
                e.target.value = "";
                return;
              }
              const reader = new FileReader();
              reader.onload = () => {
                setLogoData(reader.result);
                setLogoFileName(file.name);
              };
              reader.readAsDataURL(file);
            }}
            className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
          />
          <p className="text-xs text-slate-400 mt-1">PNG, JPG, WEBP or SVG · max 2 MB{editingKey ? " · leave unchanged to keep the current logo" : ""}</p>
          {logoFileName && <p className="text-xs text-slate-500 mt-1">Selected: {logoFileName}</p>}
        </Field>

        <Field label="Website (optional — clicking their logo opens this)">
          <input
            value={websiteUrl}
            onChange={(e) => setWebsiteUrl(e.target.value)}
            placeholder="https://example.com"
            className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
          />
        </Field>

        {logoData && (
          <div className="bg-white border border-slate-200 rounded p-3 w-fit">
            <p className="text-xs text-slate-400 mb-2">Preview</p>
            <img src={logoData} alt="Logo preview" className="max-h-12 max-w-48 object-contain" />
          </div>
        )}

        <div className="flex gap-2">
          <button
            onClick={saveAgencyLogo}
            disabled={!agencyName.trim() || !logoData}
            className="bg-amber-500 text-slate-900 text-sm font-medium px-4 py-2 rounded-lg disabled:opacity-40"
          >
            {editingKey ? "Update Agency Logo" : "Save Agency Logo"}
          </button>
          {editingKey && (
            <button onClick={resetForm} className="text-sm text-slate-500 px-2">Cancel</button>
          )}
        </div>
        {error && <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      </div>

      <h3 className="font-serif text-xl mb-3">Configured Agency Logos</h3>
      <div className="border border-slate-200 rounded-lg overflow-hidden max-w-lg">
        {Object.keys(agencyLogos).length === 0 && (
          <div className="p-4 text-sm text-slate-400">No agency logos added yet.</div>
        )}
        {Object.entries(agencyLogos).map(([key, val]) => (
          <div key={key} className="p-3 border-b last:border-b-0 border-slate-200 flex items-center justify-between gap-3">
            <div className="w-24 h-8 flex items-center justify-center bg-white border border-slate-100 rounded shrink-0">
              <img src={val.logoUrl} alt={val.name} className="max-h-7 max-w-20 object-contain" />
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium truncate">{val.name}</p>
              {val.websiteUrl && <p className="text-xs text-teal-700 truncate">{val.websiteUrl}</p>}
            </div>
            <button onClick={() => startEdit(key, val)} className="text-xs text-teal-700 hover:underline shrink-0">
              Edit
            </button>
            <button onClick={() => removeAgencyLogo(key)} className="text-xs text-rose-600 hover:underline shrink-0">
              Delete
            </button>
          </div>
        ))}
      </div>
    </section>
  );
}

function ManagerPhotoManager({ data, refresh }) {
  const [error, setError] = useState(null);
  const [busyId, setBusyId] = useState(null);

  const uploadPhoto = (manager, file) => {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      window.alert("Please choose a photo smaller than 2 MB.");
      return;
    }
    setBusyId(manager.id);
    setError(null);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api(`/api/managers/${manager.id}`, {
          method: "PATCH",
          body: JSON.stringify({ name: manager.name, agency: manager.agency, photoUrl: reader.result }),
        });
        await refresh();
      } catch (e) {
        setError(e.message);
      } finally {
        setBusyId(null);
      }
    };
    reader.readAsDataURL(file);
  };

  const removePhoto = async (manager) => {
    if (!window.confirm(`Remove photo for ${manager.name}?`)) return;
    setBusyId(manager.id);
    setError(null);
    try {
      await api(`/api/managers/${manager.id}`, {
        method: "PATCH",
        body: JSON.stringify({ name: manager.name, agency: manager.agency, photoUrl: "" }),
      });
      await refresh();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusyId(null);
    }
  };

  const saveLinkedIn = async (manager, linkedinUrl) => {
    setBusyId(manager.id);
    setError(null);
    try {
      await api(`/api/managers/${manager.id}`, {
        method: "PATCH",
        body: JSON.stringify({ name: manager.name, agency: manager.agency, linkedinUrl }),
      });
      await refresh();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusyId(null);
    }
  };

  const deleteManager = async (manager) => {
    if (!window.confirm(`Delete ${manager.name} entirely? This can't be undone.`)) return;
    setBusyId(manager.id);
    setError(null);
    try {
      await api(`/api/managers/${manager.id}`, { method: "DELETE" });
      await refresh();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusyId(null);
    }
  };

  const mergeManager = async (fromManager, toId) => {
    if (!toId) return;
    const toManager = (data.managers || []).find((m) => m.id === toId);
    if (!toManager) return;
    if (!window.confirm(`Merge "${fromManager.name}" into "${toManager.name}"? All their wins move to ${toManager.name} and "${fromManager.name}" is deleted. This can't be undone.`)) return;
    setBusyId(fromManager.id);
    setError(null);
    try {
      await api(`/api/managers/${fromManager.id}/merge-into/${toId}`, { method: "POST" });
      await refresh();
    } catch (e) {
      setError(e.message);
    } finally {
      setBusyId(null);
    }
  };

  const sorted = [...(data.managers || [])].sort((a, b) => a.name.localeCompare(b.name));

  return (
    <section className="mb-10">
      <h2 className="font-serif text-2xl">Manager Photos</h2>
      <p className="text-sm text-slate-500 mt-1 mb-4">
        Upload a photo and LinkedIn link for each manager — shown in a popup when their name is clicked on Rankings and Recent deals.
        The public tip-off form no longer lets people pick an existing manager, so the same person can land here twice under slightly
        different spellings — use "Merge into…" below to combine duplicates and keep their points on one profile.
      </p>
      {error && <div className="mb-3 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      <div className="border border-slate-200 rounded-lg overflow-hidden max-w-lg">
        {sorted.length === 0 && <div className="p-4 text-sm text-slate-400">No managers yet.</div>}
        {sorted.map((m) => (
          <ManagerPhotoRow
            key={m.id}
            manager={m}
            busy={busyId === m.id}
            otherManagers={sorted.filter((o) => o.id !== m.id)}
            onUploadPhoto={uploadPhoto}
            onRemovePhoto={removePhoto}
            onSaveLinkedIn={saveLinkedIn}
            onDelete={deleteManager}
            onMerge={mergeManager}
          />
        ))}
      </div>
    </section>
  );
}

function ManagerPhotoRow({ manager, busy, otherManagers, onUploadPhoto, onRemovePhoto, onSaveLinkedIn, onDelete, onMerge }) {
  const [linkedin, setLinkedin] = useState(manager.linkedinUrl || "");
  const [mergeTarget, setMergeTarget] = useState("");

  return (
    <div className="p-3 border-b last:border-b-0 border-slate-200 space-y-2">
      <div className="flex items-center gap-3">
        <div className="w-12 h-12 rounded-full bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center shrink-0">
          {manager.photoUrl ? (
            <img src={manager.photoUrl} alt={manager.name} className="w-full h-full object-cover" />
          ) : (
            <span className="text-[10px] text-slate-400 text-center px-1">No photo</span>
          )}
        </div>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-medium truncate">{manager.name}</p>
          {manager.agency && <p className="text-xs text-slate-500 truncate">{manager.agency}</p>}
        </div>
        <label className="text-xs text-teal-700 hover:underline cursor-pointer shrink-0">
          {busy ? "Working…" : "Upload"}
          <input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            className="hidden"
            disabled={busy}
            onChange={(e) => onUploadPhoto(manager, e.target.files?.[0])}
          />
        </label>
        {manager.photoUrl && (
          <button onClick={() => onRemovePhoto(manager)} disabled={busy} className="text-xs text-rose-600 hover:underline shrink-0">
            Remove photo
          </button>
        )}
        <button onClick={() => onDelete(manager)} disabled={busy} className="text-xs text-rose-700 font-semibold hover:underline shrink-0">
          Delete
        </button>
      </div>
      <div className="flex items-center gap-2 pl-16">
        <input
          value={linkedin}
          onChange={(e) => setLinkedin(e.target.value)}
          placeholder="LinkedIn URL"
          className="flex-1 border border-slate-300 rounded px-2 py-1 text-xs"
        />
        <button
          onClick={() => onSaveLinkedIn(manager, linkedin.trim())}
          disabled={busy}
          className="text-xs text-teal-700 hover:underline shrink-0"
        >
          {busy ? "Saving…" : "Save"}
        </button>
      </div>
      {otherManagers && otherManagers.length > 0 && (
        <div className="flex items-center gap-2 pl-16">
          <select
            value={mergeTarget}
            onChange={(e) => setMergeTarget(e.target.value)}
            disabled={busy}
            className="flex-1 border border-slate-300 rounded px-2 py-1 text-xs bg-white"
          >
            <option value="">Merge into…</option>
            {otherManagers.map((o) => (
              <option key={o.id} value={o.id}>{o.name}{o.agency ? ` · ${o.agency}` : ""}</option>
            ))}
          </select>
          <button
            onClick={() => onMerge(manager, mergeTarget)}
            disabled={busy || !mergeTarget}
            className="text-xs text-amber-700 font-semibold hover:underline shrink-0 disabled:opacity-40 disabled:no-underline"
          >
            {busy ? "Merging…" : "Merge"}
          </button>
        </div>
      )}
    </div>
  );
}

function SponsorInvites({ data, refresh }) {
  const allInvites = data.sponsorInvites || [];
  const SPONSORSHIP_PRICE = 50;
  const [copiedId, setCopiedId] = useState(null);
  const [acceptingId, setAcceptingId] = useState(null);
  const [acceptForm, setAcceptForm] = useState({ logoData: "", logoFileName: "", tagline: "", websiteUrl: "", iconData: "", iconFileName: "" });
  const [error, setError] = useState(null);

  const buildMessage = (invite) => {
    const winPhrase = invite.eventType === "renewal"
      ? `renewed ${invite.schemeName} to a ${invite.newTerm}-year term`
      : `just landed ${invite.schemeName} on a ${invite.newTerm}-year term`;
    const subject = `${invite.nominatedBy} just moved up the QLD Strata Rankings — want in?`;
    const body = `Hi,\n\n${invite.nominatedBy}${invite.nominatedByAgency ? ` at ${invite.nominatedByAgency}` : ""} ${winPhrase} on the QLD Strata Rankings — a live leaderboard tracking strata manager performance across Queensland.\n\n${invite.nominatedBy} thought ${invite.businessName} would be a great fit to sponsor this deal. For $${SPONSORSHIP_PRICE}, your logo and a short tagline about your business get featured right next to this deal on the rankings page, seen by strata managers and body corporates across QLD.\n\nInterested? Just reply here and we'll get you set up.\n\n— QLD Strata Rankings`;
    return { subject, body };
  };

  const copyMessage = async (invite) => {
    const { subject, body } = buildMessage(invite);
    const text = `Subject: ${subject}\n\n${body}`;
    try {
      await navigator.clipboard.writeText(text);
      setCopiedId(invite.id);
      setTimeout(() => setCopiedId((id) => (id === invite.id ? null : id)), 2000);
    } catch (e) {
      window.prompt("Copy failed automatically — select and copy this manually:", text);
    }
  };

  const startAccept = (invite) => {
    setAcceptingId(invite.id);
    setAcceptForm({ logoData: "", logoFileName: "", tagline: "", websiteUrl: "", iconData: "", iconFileName: "" });
    setError(null);
  };

  const confirmAccept = async (invite) => {
    if (!acceptForm.logoData) return setError("A logo is required to accept.");
    try {
      await api(`/api/sponsor-invites/${invite.id}`, {
        method: "PATCH",
        body: JSON.stringify({ status: "accepted", logoUrl: acceptForm.logoData, tagline: acceptForm.tagline.trim(), websiteUrl: acceptForm.websiteUrl.trim(), iconUrl: acceptForm.iconData }),
      });
      await refresh();
      setAcceptingId(null);
    } catch (e) {
      setError(e.message);
    }
  };

  const decline = async (invite) => {
    try {
      await api(`/api/sponsor-invites/${invite.id}`, { method: "PATCH", body: JSON.stringify({ status: "declined" }) });
      await refresh();
    } catch (e) {
      setError(e.message);
    }
  };

  const deleteInvite = async (invite) => {
    if (!window.confirm(`Remove this invite for ${invite.businessName}?`)) return;
    try {
      await api(`/api/sponsor-invites/${invite.id}`, { method: "DELETE" });
      await refresh();
    } catch (e) {
      setError(e.message);
    }
  };

  if (allInvites.length === 0) return null;
  const invites = [...allInvites].sort((a, b) => (a.status === "pending" ? -1 : 1) - (b.status === "pending" ? -1 : 1));

  return (
    <section className="mb-10">
      <h2 className="font-serif text-2xl">Sponsor invites</h2>
      <p className="text-sm text-slate-500 mt-1 mb-3">
        Tradies/contractors nominated by managers on a specific deal. Accepting attaches their logo and tagline to that deal on Recent deals — this is separate from the site-wide Sponsors strip.
      </p>
      {error && <div className="mb-3 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        {invites.map((invite) => {
          const { body } = buildMessage(invite);
          return (
            <div key={invite.id} className="p-3 border-b last:border-b-0 border-slate-200">
              <div className="flex items-center gap-3">
                {invite.logoUrl && (
                  <div className="w-16 h-8 flex items-center justify-center border border-slate-100 rounded bg-white shrink-0">
                    <img src={invite.logoUrl} alt={invite.businessName} className="max-h-6 max-w-14 object-contain" />
                  </div>
                )}
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium truncate">
                    {invite.businessName}
                    {invite.status !== "pending" && (
                      <span className={`ml-2 text-xs px-2 py-0.5 rounded-full ${invite.status === "accepted" ? "bg-teal-100 text-teal-800" : "bg-slate-100 text-slate-500"}`}>
                        {invite.status}
                      </span>
                    )}
                  </p>
                  <p className="text-xs text-slate-500">nominated by {invite.nominatedBy} for {invite.schemeName}</p>
                </div>
                <button onClick={() => copyMessage(invite)} className="text-xs text-slate-700 hover:underline shrink-0">
                  {copiedId === invite.id ? "Copied!" : "Copy"}
                </button>
                {invite.status === "pending" && acceptingId !== invite.id && (
                  <>
                    <button onClick={() => startAccept(invite)} className="text-xs text-teal-700 hover:underline shrink-0">Accept</button>
                    <button onClick={() => decline(invite)} className="text-xs text-rose-600 hover:underline shrink-0">Decline</button>
                  </>
                )}
                <button onClick={() => deleteInvite(invite)} className="text-xs text-slate-400 hover:underline shrink-0">Delete</button>
              </div>

              {acceptingId === invite.id && (
                <div className="mt-3 bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-3">
                  <Field label="Trade icon (optional)">
                    <input
                      type="file"
                      accept="image/png,image/jpeg,image/webp,image/svg+xml"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = () => setAcceptForm((f) => ({ ...f, iconData: reader.result, iconFileName: file.name }));
                        reader.readAsDataURL(file);
                      }}
                      className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
                    />
                    {acceptForm.iconData && (
                      <img src={acceptForm.iconData} alt="icon preview" className="mt-2 h-8 w-8 object-contain" />
                    )}
                  </Field>
                  <Field label="Logo">
                    <input
                      type="file"
                      accept="image/png,image/jpeg,image/webp,image/svg+xml"
                      onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = () => setAcceptForm((f) => ({ ...f, logoData: reader.result, logoFileName: file.name }));
                        reader.readAsDataURL(file);
                      }}
                      className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
                    />
                  </Field>
                  {acceptForm.logoData && (
                    <div className="bg-white border border-slate-200 rounded p-2 w-fit">
                      <img src={acceptForm.logoData} alt="preview" className="max-h-10 max-w-32 object-contain" />
                    </div>
                  )}
                  <Field label="Tagline (shown next to the logo on this deal)">
                    <input
                      value={acceptForm.tagline}
                      onChange={(e) => setAcceptForm((f) => ({ ...f, tagline: e.target.value }))}
                      placeholder="e.g. Reliable maintenance for body corporates across Brisbane"
                      className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
                    />
                  </Field>
                  <Field label="Website (optional — clicking their logo opens this)">
                    <input
                      value={acceptForm.websiteUrl}
                      onChange={(e) => setAcceptForm((f) => ({ ...f, websiteUrl: e.target.value }))}
                      placeholder="https://example.com"
                      className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
                    />
                  </Field>
                  <div className="flex gap-2">
                    <button onClick={() => confirmAccept(invite)} className="bg-amber-500 text-slate-900 text-sm font-medium px-4 py-2 rounded-lg">Confirm sponsor</button>
                    <button onClick={() => setAcceptingId(null)} className="text-sm text-slate-500 px-2">Cancel</button>
                  </div>
                </div>
              )}

              <div className="mt-2 bg-slate-50 border border-slate-200 rounded p-3">
                <textarea readOnly value={body} className="w-full text-xs text-slate-700 bg-white border border-slate-200 rounded p-2 font-mono" rows={5} onClick={(e) => e.target.select()} />
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function SponsorManager({ data, refresh }) {
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({ name: "", logoData: "", logoName: "", websiteUrl: "", position: 1, active: true });
  const [error, setError] = useState(null);

  const reset = () => {
    setEditingId(null);
    setDraft({ name: "", logoData: "", logoName: "", websiteUrl: "", position: 1, active: true });
  };

  const startAdd = () => {
    const nextPosition = Math.max(0, ...(data.sponsors || []).map((s) => Number(s.position) || 0)) + 1;
    setEditingId("new");
    setDraft({ name: "", logoData: "", logoName: "", websiteUrl: "", position: nextPosition, active: true });
  };

  const startEdit = (s) => {
    setEditingId(s.id);
    setDraft({ name: s.name || "", logoData: s.logoUrl || "", logoName: s.logoName || "", websiteUrl: s.websiteUrl || "", position: s.position || 1, active: s.active !== false });
  };

  const save = async () => {
    if (!draft.name.trim()) return;
    try {
      await api("/api/sponsors", {
        method: "POST",
        body: JSON.stringify({
          id: editingId === "new" ? undefined : editingId,
          name: draft.name.trim(),
          logoUrl: draft.logoData || "",
          logoName: draft.logoName || "",
          websiteUrl: draft.websiteUrl || "",
          position: Number(draft.position) || 1,
          active: !!draft.active,
        }),
      });
      await refresh();
      reset();
    } catch (e) {
      setError(e.message);
    }
  };

  const remove = async (id) => {
    if (!window.confirm("Delete this sponsor?")) return;
    try {
      await api(`/api/sponsors/${id}`, { method: "DELETE" });
      await refresh();
    } catch (e) {
      setError(e.message);
    }
  };

  const sorted = [...(data.sponsors || [])].sort((a, b) => (a.position || 99) - (b.position || 99));

  return (
    <section className="mb-10">
      <div className="flex items-center justify-between mb-3">
        <div>
          <h2 className="font-serif text-2xl">Sponsors</h2>
          <p className="text-sm text-slate-500 mt-1">Control logos shown on the public Rankings page.</p>
        </div>
        <button onClick={startAdd} className="bg-slate-900 text-white text-sm font-medium px-3 py-2 rounded-lg">+ Add sponsor</button>
      </div>
      {error && <div className="mb-3 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        {sorted.length === 0 && <div className="p-5 text-sm text-slate-400">No sponsors added.</div>}
        {sorted.map((s) => (
          <div key={s.id} className="p-3 border-b last:border-b-0 border-slate-200 flex items-center gap-3">
            <div className="w-28 h-10 flex items-center justify-center border border-slate-100 rounded bg-white shrink-0">
              {s.logoUrl ? <img src={s.logoUrl} alt={s.name} className="max-h-8 max-w-24 object-contain" /> : <span className="text-xs text-slate-400">No logo</span>}
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium truncate">{s.name}</p>
              <p className="text-xs text-slate-500">Position {s.position || 1}</p>
            </div>
            <button onClick={() => startEdit(s)} className="text-xs text-teal-700 hover:underline">Edit</button>
            <button onClick={() => remove(s.id)} className="text-xs text-rose-600 hover:underline">Delete</button>
          </div>
        ))}
      </div>

      {editingId && (
        <div className="mt-4 bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-3">
          <Field label="Sponsor name">
            <input value={draft.name} onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))} className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white" />
          </Field>
          <Field label="Sponsor logo">
            <input type="file" accept="image/*" onChange={(e) => {
              const file = e.target.files?.[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => setDraft((d) => ({ ...d, logoData: reader.result, logoName: file.name }));
              reader.readAsDataURL(file);
            }} className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white" />
          </Field>
          <Field label="Website (optional — clicking their logo opens this)">
            <input
              value={draft.websiteUrl}
              onChange={(e) => setDraft((d) => ({ ...d, websiteUrl: e.target.value }))}
              placeholder="https://example.com"
              className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"
            />
          </Field>
          <div className="flex gap-2 pt-1">
            <button onClick={save} className="bg-amber-500 text-slate-900 text-sm font-medium px-4 py-2 rounded-lg">Save sponsor</button>
            <button onClick={reset} className="text-sm text-slate-500 px-4 py-2">Cancel</button>
          </div>
        </div>
      )}
    </section>
  );
}

function RecordWin({ data, refresh }) {
  const [managerChoice, setManagerChoice] = useState("__new__");
  const [managerName, setManagerName] = useState("");
  const [agencyChoice, setAgencyChoice] = useState("__new__");
  const [agency, setAgency] = useState("");
  const [schemeChoice, setSchemeChoice] = useState("__new__");
  const [suburb, setSuburb] = useState("");
  const [planType, setPlanType] = useState("BFP");
  const [module, setModule] = useState("");
  const [lotCount, setLotCount] = useState("");
  const [schemeName, setSchemeName] = useState("");
  const [cts, setCts] = useState("");
  const [winType, setWinType] = useState("");
  const [newTerm, setNewTerm] = useState("");
  const [prevTerm, setPrevTerm] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [confirmation, setConfirmation] = useState(null);
  const [error, setError] = useState(null);

  const sortedManagers = [...data.managers].sort((a, b) => a.name.localeCompare(b.name));
  const sortedSchemes = [...data.schemes].sort((a, b) => schemeLabel(a).localeCompare(schemeLabel(b)));
  const agencyNames = [...new Set(Object.values(data.agencyLogos || {}).map((v) => v.name))].sort((a, b) => a.localeCompare(b));
  const previewPoints = computePoints(winType, newTerm, prevTerm);

  const submit = async () => {
    const isNewManager = managerChoice === "__new__";
    const isNewScheme = schemeChoice === "__new__";
    if (isNewManager && !managerName.trim()) return setError("Manager's name is required.");
    if (isNewScheme && (!suburb.trim() || !module.trim() || !lotCount)) return setError("Suburb, module, and lot count are required.");
    if (!winType) return setError("Select how this scheme was secured.");
    if (!newTerm) return setError("Select the new term.");
    if (winType === "renewal" && !prevTerm) return setError("Previous term is required for a renewal.");

    setError(null);
    try {
      const result = await api("/api/events", {
        method: "POST",
        body: JSON.stringify({
          managerId: isNewManager ? null : managerChoice,
          managerName: isNewManager ? managerName : undefined,
          agency: isNewManager ? agency : undefined,
          schemeId: isNewScheme ? null : schemeChoice,
          suburb: isNewScheme ? suburb : undefined,
          planType: isNewScheme ? planType : undefined,
          module: isNewScheme ? module : undefined,
          lotCount: isNewScheme ? lotCount : undefined,
          schemeName: isNewScheme ? schemeName : undefined,
          cts: isNewScheme ? cts : undefined,
          type: winType,
          newTerm,
          prevTerm: winType === "renewal" ? prevTerm : undefined,
          date,
        }),
      });
      await refresh();
      setManagerChoice("__new__"); setManagerName(""); setAgencyChoice("__new__"); setAgency("");
      setSchemeChoice("__new__"); setSuburb(""); setModule(""); setLotCount(""); setSchemeName(""); setCts("");
      setWinType(""); setNewTerm(""); setPrevTerm("");
      setConfirmation({ points: result.event.points, label: `Logged for ${result.manager.name} — ${result.event.points} points` });
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <section className="mb-10 max-w-lg">
      <h2 className="font-serif text-2xl mb-4">Record a deal</h2>
      <div className="space-y-3">
        <Field label="How was this scheme secured?">
          <select value={winType} onChange={(e) => { setWinType(e.target.value); setPrevTerm(""); }} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            <option value="">Select…</option>
            <option value="competitor">Signed from a competitor</option>
            <option value="renewal">Renewed</option>
          </select>
        </Field>

        {sortedManagers.length > 0 && (
          <Field label="Manager">
            <select value={managerChoice} onChange={(e) => setManagerChoice(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
              <option value="__new__">+ Add new manager…</option>
              {sortedManagers.map((m) => (
                <option key={m.id} value={m.id}>{m.name}{m.agency ? ` · ${m.agency}` : ""}</option>
              ))}
            </select>
          </Field>
        )}
        {managerChoice === "__new__" && (
          <div className={sortedManagers.length > 0 ? "pl-3 border-l-2 border-slate-200 space-y-3" : "space-y-3"}>
            <Field label="Manager's name"><input value={managerName} onChange={(e) => setManagerName(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" /></Field>
            <Field label="Manager's agency">
              <select
                value={agencyChoice}
                onChange={(e) => {
                  const v = e.target.value;
                  setAgencyChoice(v);
                  setAgency(v === "__new__" ? "" : v);
                }}
                className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"
              >
                <option value="__new__">+ Type new agency…</option>
                {agencyNames.map((n) => (
                  <option key={n} value={n}>{n}</option>
                ))}
              </select>
              {agencyChoice === "__new__" && (
                <input
                  value={agency}
                  onChange={(e) => setAgency(e.target.value)}
                  placeholder="Agency name"
                  className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-2"
                />
              )}
            </Field>
          </div>
        )}

        {sortedSchemes.length > 0 && (
          <Field label="Scheme">
            <select value={schemeChoice} onChange={(e) => setSchemeChoice(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
              <option value="__new__">+ Add new scheme…</option>
              {sortedSchemes.map((s) => (
                <option key={s.id} value={s.id}>{schemeLabel(s)}</option>
              ))}
            </select>
          </Field>
        )}
        {schemeChoice === "__new__" && (
          <div className={sortedSchemes.length > 0 ? "pl-3 border-l-2 border-slate-200 space-y-3" : "space-y-3"}>
            <Field label="Suburb (where the scheme is located)"><input value={suburb} onChange={(e) => setSuburb(e.target.value)} placeholder="e.g. New Farm" className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" /></Field>
            <Field label="Scheme type">
              <select value={planType} onChange={(e) => setPlanType(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
                <option value="BFP">BFP</option>
                <option value="SFP">SFP</option>
              </select>
            </Field>
            <Field label="Module">
              <select value={module} onChange={(e) => setModule(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
                <option value="">Select…</option>
                {BCCM_MODULES.map((m) => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>
            </Field>
            <Field label="Number of lots"><input type="number" min="1" value={lotCount} onChange={(e) => setLotCount(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" /></Field>
            <div>
              <label className="block text-sm text-slate-600 mb-1 flex items-center">
                Scheme name
                <InfoTooltip text="Never published — kept privately to verify the deal is genuine." />
              </label>
              <input value={schemeName} onChange={(e) => setSchemeName(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
            </div>
            <div>
              <label className="block text-sm text-slate-600 mb-1 flex items-center">
                CTS number
                <InfoTooltip text="Never published — kept privately to verify the deal is genuine." />
              </label>
              <input value={cts} onChange={(e) => setCts(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
            </div>
          </div>
        )}

        <Field label="New term (years)">
          <select value={newTerm} onChange={(e) => setNewTerm(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
            <option value="">Select…</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </Field>

        {winType === "renewal" && (
          <Field label="Previous term (years)">
            <select value={prevTerm} onChange={(e) => setPrevTerm(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
              <option value="">Select…</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </Field>
        )}

        {winType && newTerm && (winType !== "renewal" || prevTerm) && (
          <div className="bg-amber-400 border-2 border-amber-500 rounded-lg px-4 py-3 text-center shadow-sm">
            <span className="text-black font-extrabold text-lg">
              Worth {previewPoints} point{previewPoints === 1 ? "" : "s"}
            </span>
          </div>
        )}

        <Field label="Date"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" /></Field>

        <button onClick={submit} className="bg-amber-500 text-slate-900 font-medium px-5 py-2.5 rounded-lg text-sm hover:bg-amber-400">Save</button>
        {error && <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
        {confirmation && <div className="bg-teal-50 border border-teal-200 rounded-lg p-3 text-sm text-teal-800">{confirmation.label}</div>}
      </div>
    </section>
  );
}

function Field({ label, children }) {
  return <div><label className="block text-sm text-slate-600 mb-1">{label}</label>{children}</div>;
}

function NominationRow({ ev, manager, scheme, sponsorInvites, agencyLogos, refresh }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(null);
  const [error, setError] = useState(null);
  const [addingContractor, setAddingContractor] = useState(false);
  const [contractorForm, setContractorForm] = useState({ businessName: "", contactName: "", logoData: "", tagline: "", websiteUrl: "", iconData: "", iconFileName: "" });
  const [contractorError, setContractorError] = useState(null);
  const [reviewBusy, setReviewBusy] = useState(false);
  const [reviewError, setReviewError] = useState(null);

  const contractors = (sponsorInvites || []).filter((inv) => inv.eventId === ev.id && inv.status === "accepted" && inv.logoUrl);
  const agencyNames = [...new Set(Object.values(agencyLogos || {}).map((v) => v.name))].sort((a, b) => a.localeCompare(b));

  // Public tip-offs no longer collect scheme type / module, or a manager
  // photo — admin must fill those in before a win can go live.
  const missingSchemeDetails = approved => approved && (!scheme?.planType || !scheme?.module);
  const missingManagerPhoto = approved => approved && !manager?.photoUrl;
  const approvalBlockers = () => {
    const reasons = [];
    if (missingSchemeDetails(true)) reasons.push("scheme type & module (Edit)");
    if (missingManagerPhoto(true)) reasons.push("manager photo (Managers tab)");
    return reasons;
  };

  const setApproved = async (approved) => {
    const blockers = approved ? approvalBlockers() : [];
    if (blockers.length > 0) {
      setReviewError(`Add ${blockers.join(" and ")} before approving.`);
      return;
    }
    setReviewBusy(true);
    setReviewError(null);
    try {
      await api(`/api/events/${ev.id}/review`, { method: "PATCH", body: JSON.stringify({ status: approved ? "approved" : "pending" }) });
      await refresh();
    } catch (e) {
      setReviewError(e.message);
    } finally {
      setReviewBusy(false);
    }
  };

  const setTipSource = async (tipSource) => {
    setReviewBusy(true);
    setReviewError(null);
    try {
      await api(`/api/events/${ev.id}/review`, { method: "PATCH", body: JSON.stringify({ tipSource }) });
      await refresh();
    } catch (e) {
      setReviewError(e.message);
    } finally {
      setReviewBusy(false);
    }
  };

  const uploadProof = (file) => {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      window.alert("Please choose an image smaller than 5 MB.");
      return;
    }
    setReviewBusy(true);
    setReviewError(null);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api(`/api/events/${ev.id}/review`, { method: "PATCH", body: JSON.stringify({ proofUrl: reader.result }) });
        await refresh();
      } catch (e) {
        setReviewError(e.message);
      } finally {
        setReviewBusy(false);
      }
    };
    reader.readAsDataURL(file);
  };

  const startAddContractor = () => {
    setContractorForm({ businessName: "", contactName: "", logoData: "", tagline: "", websiteUrl: "", iconData: "", iconFileName: "" });
    setContractorError(null);
    setAddingContractor(true);
  };

  const saveContractor = async () => {
    if (!contractorForm.businessName.trim()) return setContractorError("Business name is required.");
    if (!contractorForm.logoData) return setContractorError("A logo is required.");
    try {
      await api("/api/sponsor-invites", {
        method: "POST",
        body: JSON.stringify({
          eventId: ev.id,
          businessName: contractorForm.businessName.trim(),
          contactName: contractorForm.contactName.trim() || undefined,
          eventType: ev.type,
          schemeName: schemeLabel(scheme),
          newTerm: ev.newTerm,
          nominatedBy: manager?.name || "",
          nominatedByAgency: manager?.agency || "",
          status: "accepted",
          logoUrl: contractorForm.logoData,
          tagline: contractorForm.tagline.trim(),
          websiteUrl: contractorForm.websiteUrl.trim(),
          iconUrl: contractorForm.iconData,
        }),
      });
      await refresh();
      setAddingContractor(false);
    } catch (e) {
      setContractorError(e.message);
    }
  };

  const removeContractor = async (contractor) => {
    if (!window.confirm(`Remove ${contractor.businessName} from this win?`)) return;
    setContractorError(null);
    try {
      await api(`/api/sponsor-invites/${contractor.id}`, { method: "DELETE" });
      await refresh();
    } catch (e) {
      setContractorError(`Couldn't remove ${contractor.businessName}: ${e.message}`);
    }
  };

  const startEdit = () => {
    setForm({
      managerName: manager?.name || "",
      agency: manager?.agency || "",
      suburb: scheme?.suburb || "",
      planType: scheme?.planType || "BFP",
      module: scheme?.module || "",
      lotCount: scheme?.lotCount || "",
      schemeName: scheme?.schemeName || "",
      cts: scheme?.cts || "",
      mode: ev.type === "renewal" ? "renewal" : "competitor",
      newTerm: String(ev.newTerm),
      prevTerm: ev.prevTerm != null ? String(ev.prevTerm) : "",
      points: ev.points,
      date: ev.date,
    });
    setEditing(true);
  };

  const save = async () => {
    if (!form.managerName.trim() || !form.suburb.trim() || !form.module.trim() || !form.lotCount) return;
    try {
      await api(`/api/events/${ev.id}`, {
        method: "PATCH",
        body: JSON.stringify({
          managerName: form.managerName,
          agency: form.agency,
          suburb: form.suburb,
          planType: form.planType,
          module: form.module,
          lotCount: form.lotCount,
          schemeName: form.schemeName,
          cts: form.cts,
          type: form.mode,
          newTerm: form.newTerm,
          prevTerm: form.mode === "renewal" ? form.prevTerm : "",
          points: form.points,
          date: form.date,
        }),
      });
      await refresh();
      setEditing(false);
    } catch (e) {
      setError(e.message);
    }
  };

  const remove = async () => {
    if (!window.confirm("Delete this nomination? This cannot be undone.")) return;
    try {
      await api(`/api/events/${ev.id}`, { method: "DELETE" });
      await refresh();
    } catch (e) {
      setError(e.message);
    }
  };

  if (!editing) {
    return (
      <div className="py-3 border-b border-slate-200 last:border-b-0">
        <div className="flex items-start gap-4">
          <div className="flex-1 min-w-0">

function NominationsManager({ data, refresh }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const managerById = (id) => data.managers.find((m) => m.id === id);
  const schemeById = (id) => data.schemes.find((s) => s.id === id);

  const pendingCount = data.events.filter((e) => e.status !== "approved").length;

  const events = useMemo(() => {
    const q = query.trim().toLowerCase();
    return [...data.events]
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .filter((ev) => {
        if (statusFilter === "pending" && ev.status === "approved") return false;
        if (statusFilter === "approved" && ev.status !== "approved") return false;
        if (!q) return true;
        const manager = managerById(ev.managerId);
        const scheme = schemeById(ev.schemeId);
        const haystack = `${manager?.name || ""} ${manager?.agency || ""} ${schemeLabel(scheme)}`.toLowerCase();
        return haystack.includes(q);
      });
  }, [data, query, statusFilter]);

  return (
    <section className="mb-10">
      <h2 className="font-serif text-2xl mb-1">All nominations</h2>
      <p className="text-sm text-slate-500 mb-4">Edit or delete any nomination, past or present.</p>
      <div className="flex gap-1 bg-slate-100 rounded-full p-1 w-fit mb-4">
        {[
          { id: "all", label: "All" },
          { id: "pending", label: `Pending${pendingCount > 0 ? ` (${pendingCount})` : ""}` },
          { id: "approved", label: "Approved" },
        ].map(({ id, label }) => (
          <button
            key={id}
            onClick={() => setStatusFilter(id)}
            className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${statusFilter === id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}
          >
            {label}
          </button>
        ))}
      </div>
      <input
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        placeholder="Search by manager, agency, or suburb…"
        className="w-full max-w-lg border border-slate-300 rounded px-3 py-2 text-sm mb-4"
      />
      <div className="max-w-2xl border border-slate-200 rounded-lg overflow-hidden px-3">
        {events.length === 0 && <p className="text-sm text-slate-400 py-4">No nominations found.</p>}
        {events.map((ev) => (
          <NominationRow key={ev.id} ev={ev} manager={managerById(ev.managerId)} scheme={schemeById(ev.schemeId)} sponsorInvites={data.sponsorInvites} agencyLogos={data.agencyLogos} refresh={refresh} />
        ))}
      </div>
    </section>
  );
}

function DrillEntryImage({ entry, field, label, shape, onSaved }) {
  // field is "photo" or "logo" — picks the API route and the response key.
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const url = field === "photo" ? entry.photoUrl : entry.logoUrl;
  const key = field === "photo" ? "photoUrl" : "logoUrl";

  const save = async (value) => {
    setBusy(true);
    setError(null);
    try {
      const updated = await api(`/api/admin/drill/${entry.id}/${field}`, {
        method: "PATCH",
        body: JSON.stringify({ [key]: value }),
      });
      onSaved(entry.id, field, updated[key]);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const upload = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => save(reader.result);
    reader.readAsDataURL(file);
  };

  return (
    <div className="flex items-center gap-2">
      {url ? (
        <img src={url} alt={label} className={`w-10 h-10 object-cover border border-slate-200 ${shape === "circle" ? "rounded-full" : "rounded"}`} />
      ) : (
        <div className={`w-10 h-10 bg-slate-100 border border-dashed border-slate-300 ${shape === "circle" ? "rounded-full" : "rounded"}`} />
      )}
      <label className={`text-xs font-semibold text-teal-700 hover:underline cursor-pointer ${busy ? "opacity-40 pointer-events-none" : ""}`}>
        {url ? `Replace ${label}` : `Add ${label}`}
        <input type="file" accept="image/*" className="hidden" disabled={busy} onChange={(e) => upload(e.target.files?.[0])} />
      </label>
      {url && (
        <button onClick={() => save(null)} disabled={busy} className="text-xs text-rose-600 hover:underline disabled:opacity-40">Remove</button>
      )}
      {error && <span className="text-xs text-rose-600">{error}</span>}
    </div>
  );
}

function DrillEntryReview({ entry, tasks, onVerdict, onImageSaved, onCrown }) {
  const [open, setOpen] = useState(false);
  const taskById = (id) => tasks.find((t) => t.id === id);
  const verdictPill =
    entry.isCorrect === true ? <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-teal-100 text-teal-800">Correct</span> :
    entry.isCorrect === false ? <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">Incorrect</span> :
    <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Pending</span>;

  return (
    <div className="border border-slate-200 rounded-xl overflow-hidden">
      <div className="flex flex-wrap items-center gap-3 px-4 py-3 bg-white">
        <button onClick={() => setOpen((o) => !o)} className="text-slate-400 hover:text-slate-700 text-sm shrink-0" title="View answers">
          {open ? "▾" : "▸"}
        </button>
        <div className="min-w-0 flex-1">
          <p className="text-sm font-medium text-slate-900 truncate">{entry.name}</p>
          <p className="text-xs text-slate-500 truncate">{[entry.role, entry.company].filter(Boolean).join(" · ")}</p>
        </div>
        <span className="text-sm font-bold text-amber-700 shrink-0">{Math.floor(entry.elapsedSeconds / 60)}m {entry.elapsedSeconds % 60}s</span>
        {verdictPill}
        <div className="flex gap-1 shrink-0">
          <button onClick={() => onVerdict(entry.id, true)} className={`text-xs font-semibold px-2 py-1 rounded border ${entry.isCorrect === true ? "bg-teal-600 text-white border-teal-600" : "border-teal-300 text-teal-700 hover:bg-teal-50"}`}>Correct</button>
          <button onClick={() => onVerdict(entry.id, false)} className={`text-xs font-semibold px-2 py-1 rounded border ${entry.isCorrect === false ? "bg-rose-600 text-white border-rose-600" : "border-rose-300 text-rose-700 hover:bg-rose-50"}`}>Incorrect</button>
          {entry.isCorrect === true && (
            entry.isWinner
              ? <span className="text-xs font-extrabold px-2 py-1 rounded bg-amber-400 text-slate-900">👑 Winner</span>
              : <button onClick={() => onCrown(entry.id)} className="text-xs font-semibold px-2 py-1 rounded border border-amber-400 text-amber-700 hover:bg-amber-50">👑 Make winner</button>
          )}
          {entry.isCorrect !== null && (
            <button onClick={() => onVerdict(entry.id, null)} className="text-xs font-semibold px-2 py-1 rounded border border-slate-300 text-slate-500 hover:bg-slate-50">Reset</button>
          )}
        </div>
      </div>

      {entry.isCorrect === true && (
        <div className="flex flex-wrap items-center gap-6 px-4 py-2 bg-teal-50/50 border-t border-slate-100">
          <DrillEntryImage entry={entry} field="photo" label="photo" shape="circle" onSaved={onImageSaved} />
          <DrillEntryImage entry={entry} field="logo" label="logo" shape="square" onSaved={onImageSaved} />
        </div>
      )}

      {open && (
        <div className="border-t border-slate-100 divide-y divide-slate-100">
          {entry.answers.map((a, i) => {
            const t = taskById(a.taskId);
            return (
              <div key={i} className="px-4 py-3 bg-slate-50">
                <p className="text-xs font-bold uppercase tracking-wide text-amber-700 mb-1">Task {i + 1}{t ? `: ${t.title}` : ""}</p>
                <p className="text-sm text-slate-800 whitespace-pre-wrap mb-2">{a.text}</p>
                {t && (
                  <details className="text-xs text-slate-500">
                    <summary className="cursor-pointer text-teal-700 hover:underline">Model answer &amp; marking guide</summary>
                    <p className="whitespace-pre-wrap mt-1"><span className="font-semibold">Model answer:</span> {t.modelAnswer || "None yet for this question."}</p>
                    <p className="whitespace-pre-wrap mt-2"><span className="font-semibold">Marking guide:</span> {t.markingGuide || "None yet."}</p>
                  </details>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const brisbaneTime = (iso) => new Date(iso).toLocaleTimeString("en-AU", { timeZone: "Australia/Brisbane", hour: "numeric", minute: "2-digit" });

function DrillAudioUploader({ library, onDone }) {
  const [log, setLog] = useState([]);
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const readB64 = (file) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Couldn't read file"));
    r.readAsDataURL(file);
  });

  const upload = async (fileList) => {
    const files = Array.from(fileList);
    if (files.length === 0) return;
    setBusy(true);
    setLog([]);
    const out = [];
    for (const f of files) {
      const m = /^(?:set\s*([12])[\s_-]*)?(scenario|question)[\s_-]*(\d+)/i.exec(f.name);
      if (!m) { out.push({ name: f.name, ok: false, msg: "Name must be like Scenario 12.mp3 or Set 2 Question 12.mp3" }); setLog([...out]); continue; }
      const taskId = (m[1] === "2" ? 100 : 0) + Number(m[3]);
      try {
        const data = await readB64(f);
        await api("/api/admin/drill/audio", { method: "POST", body: JSON.stringify({ taskId, part: m[2].toLowerCase(), data }) });
        out.push({ name: f.name, ok: true });
      } catch (e) {
        out.push({ name: f.name, ok: false, msg: e.message });
      }
      setLog([...out]);
    }
    setBusy(false);
    if (inputRef.current) inputRef.current.value = "";
    onDone();
  };

  const complete = library.filter((t) => t.audio && t.audio.scenario && t.audio.question).length;
  const failed = log.filter((l) => !l.ok);

  return (
    <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
      <p className="text-xs font-bold uppercase tracking-wide text-amber-700">Audio ({complete} of {library.length} questions ready)</p>
      <p className="text-xs text-slate-500 mt-1 mb-3">Pick as many MP3s as you like. Set 1: <span className="font-semibold">Scenario 1.mp3</span> and <span className="font-semibold">Question 1.mp3</span>. Set 2: <span className="font-semibold">Set 2 Scenario 1.mp3</span> and <span className="font-semibold">Set 2 Question 1.mp3</span>. Each row below shows the exact names it needs. Re-uploading replaces the old clip.</p>
      <input ref={inputRef} type="file" accept="audio/*,.mp3" multiple disabled={busy} onChange={(e) => upload(e.target.files)} className="text-sm" />
      {busy && <p className="text-xs text-slate-600 mt-2">Uploading… {log.length}</p>}
      {!busy && log.length > 0 && (
        <p className={`text-xs mt-2 font-semibold ${failed.length ? "text-rose-600" : "text-teal-700"}`}>
          {log.length - failed.length} uploaded{failed.length ? `, ${failed.length} failed` : ""}
        </p>
      )}
      {failed.map((l, i) => <p key={i} className="text-xs text-rose-600">{l.name}: {l.msg}</p>)}
    </div>
  );
}

function DrillRowAudio({ t, onDone }) {
  const [busy, setBusy] = useState(null);
  const [err, setErr] = useState(null);
  const set = (t.audio || {});

  const send = async (part, file) => {
    if (!file) return;
    setBusy(part);
    setErr(null);
    try {
      const data = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error("Couldn't read file"));
        r.readAsDataURL(file);
      });
      await api("/api/admin/drill/audio", { method: "POST", body: JSON.stringify({ taskId: t.id, part, data }) });
      await onDone();
    } catch (e) {
      setErr(e.message);
    } finally {
      setBusy(null);
    }
  };

  return (
    <div className="w-full flex flex-wrap items-center gap-2 pl-10">
      {["scenario", "question"].map((part) => (
        <label
          key={part}
          className={`cursor-pointer text-xs font-bold px-3 py-1.5 rounded-full border ${set[part] ? "border-teal-300 bg-teal-50 text-teal-800" : "border-slate-300 bg-white text-slate-700 hover:bg-slate-50"}`}
        >
          {busy === part ? "Uploading…" : `${set[part] ? "✓ " : "⬆ "}${part === "scenario" ? "Scenario" : "Question"}${set[part] ? " (replace)" : ""}`}
          <input type="file" accept="audio/*,.mp3" className="hidden" disabled={busy !== null} onChange={(e) => { send(part, e.target.files[0]); e.target.value = ""; }} />
        </label>
      ))}
      {err && <span className="text-xs text-rose-600">{err}</span>}
    </div>
  );
}

function DrillManualWinner({ date, hasLaunch, onAdded }) {
  const empty = { name: "", role: "", company: "", answer: "", time: "", photoUrl: "", logoUrl: "" };
  const [open, setOpen] = useState(false);
  const [f, setF] = useState(empty);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));

  // Shrink the picture before it goes up, so phone photos don't bloat the database.
  const shrink = (file, max) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("Couldn't read the picture"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That file isn't a picture"));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.85));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });

  const pick = async (key, file, max) => {
    if (!file) return;
    try { set(key, await shrink(file, max)); } catch (e) { setErr(e.message); }
  };

  const parseTime = (t) => {
    const m = /^(?:(\d+):)?(\d{1,2}):(\d{2})$|^(\d+):(\d{2})$|^(\d+)$/.exec(t.trim());
    if (!m) return null;
    if (m[6] !== undefined) return Number(m[6]) * 60; // plain number = minutes
    if (m[4] !== undefined) return Number(m[4]) * 60 + Number(m[5]);
    return Number(m[1] || 0) * 3600 + Number(m[2]) * 60 + Number(m[3]);
  };

  const submit = async () => {
    setErr(null);
    const secs = parseTime(f.time);
    if (!f.name.trim() || !f.company.trim()) return setErr("Name and company are required.");
    if (secs === null) return setErr("Time taken like 4:30 (minutes:seconds).");
    setBusy(true);
    try {
      await api("/api/admin/drill/manual", {
        method: "POST",
        body: JSON.stringify({ drillDate: date, name: f.name, role: f.role, company: f.company, answer: f.answer, elapsedSeconds: secs, photoUrl: f.photoUrl, logoUrl: f.logoUrl }),
      });
      setF(empty);
      setOpen(false);
      await onAdded();
    } catch (e) {
      setErr(e.message);
    } finally {
      setBusy(false);
    }
  };

  const input = "w-full border border-slate-300 rounded px-3 py-2 text-base sm:text-sm";
  if (!open) {
    return <button onClick={() => setOpen(true)} className="mb-6 text-sm font-bold px-4 py-2 rounded-full bg-slate-900 text-amber-400">＋ Add winner manually</button>;
  }
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4 mb-6 space-y-3">
      <p className="text-xs font-bold uppercase tracking-wide text-amber-700">Add winner for {date}</p>
      {!hasLaunch && <p className="text-xs text-rose-600">That day wasn't launched, so this won't show on the public board.</p>}
      <input className={input} placeholder="Name" value={f.name} onChange={(e) => set("name", e.target.value)} />
      <input className={input} placeholder="Role" value={f.role} onChange={(e) => set("role", e.target.value)} />
      <input className={input} placeholder="Company" value={f.company} onChange={(e) => set("company", e.target.value)} />
      <input className={input} placeholder="Time taken, e.g. 4:30" value={f.time} onChange={(e) => set("time", e.target.value)} />
      <textarea className={input} rows={4} placeholder="Their answer" value={f.answer} onChange={(e) => set("answer", e.target.value)} />
      <div className="flex flex-wrap gap-4">
        {[["photoUrl", "Photo of person", 600, "rounded-full"], ["logoUrl", "Company logo", 500, "rounded"]].map(([key, label, max, shape]) => (
          <div key={key} className="flex items-center gap-2">
            {f[key] ? <img src={f[key]} alt="" className={`w-12 h-12 object-cover border border-slate-200 ${shape}`} /> : <div className={`w-12 h-12 bg-slate-100 border border-dashed border-slate-300 ${shape}`} />}
            <label className="text-xs font-semibold text-teal-700 cursor-pointer hover:underline">
              {f[key] ? `Replace ${label.toLowerCase()}` : label}
              <input type="file" accept="image/*" className="hidden" onChange={(e) => { pick(key, e.target.files[0], max); e.target.value = ""; }} />
            </label>
          </div>
        ))}
      </div>
      {err && <p className="text-sm text-rose-600">{err}</p>}
      <div className="flex gap-2">
        <button onClick={submit} disabled={busy} className="px-4 py-2 rounded-full bg-amber-500 text-slate-900 font-bold text-sm disabled:opacity-50">{busy ? "Adding…" : "Add winner"}</button>
        <button onClick={() => { setOpen(false); setErr(null); }} className="px-4 py-2 rounded-full border border-slate-300 text-sm">Cancel</button>
      </div>
    </div>
  );
}

function DrillAdmin() {
  const [date, setDate] = useState(brisbaneToday());
  const [payload, setPayload] = useState(null);
  const [library, setLibrary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tasksOpen, setTasksOpen] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const isToday = date === brisbaneToday();

  const load = async (d, silent) => {
    if (!silent) setLoading(true);
    if (!silent) setError(null);
    try {
      const r = await api(`/api/admin/drill?date=${d}`);
      setPayload(r);
    } catch (e) {
      if (!silent) setError(e.message);
    } finally {
      if (!silent) setLoading(false);
    }
  };

  const loadLibrary = async () => {
    try {
      setLibrary(await api("/api/admin/drill/tasks"));
    } catch (e) {
      setError(e.message);
    }
  };

  useEffect(() => { load(date); }, [date]);
  useEffect(() => { if (isToday && !library) loadLibrary(); }, [isToday]);

  // Submissions arrive through the day — keep today's list fresh.
  useEffect(() => {
    if (!isToday) return;
    const id = setInterval(() => load(date, true), 20000);
    return () => clearInterval(id);
  }, [date, isToday]);

  const shiftDate = (days) => {
    const [y, m, d] = date.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    setDate(dt.toISOString().slice(0, 10));
  };

  const launchTask = async (t) => {
    const switching = !!(payload && payload.launch);
    const msg = switching
      ? `Switch today's question to "${t.title}"? Nobody has answered yet.`
      : `Launch "${t.title}" now? The public clock starts immediately.`;
    if (!window.confirm(msg)) return;
    setBusyId(t.id);
    setError(null);
    try {
      await api("/api/admin/drill/launch", { method: "POST", body: JSON.stringify({ taskId: t.id }) });
      await Promise.all([load(date, true), loadLibrary()]);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusyId(null);
    }
  };

  const unlaunch = async () => {
    if (!window.confirm("Take today's question offline? The public page goes back to 'goes live at 9am'.")) return;
    setError(null);
    try {
      await api("/api/admin/drill/unlaunch", { method: "POST", body: "{}" });
      await Promise.all([load(date, true), loadLibrary()]);
    } catch (e) {
      setError(e.message);
    }
  };

  const onVerdict = async (entryId, isCorrect) => {
    setPayload((p) => p && { ...p, entries: p.entries.map((e) => (e.id === entryId ? { ...e, isCorrect, isWinner: isCorrect === true ? e.isWinner : false } : e)) });
    try {
      await api(`/api/admin/drill/${entryId}`, { method: "PATCH", body: JSON.stringify({ isCorrect }) });
    } catch (e) {
      setError(e.message);
    }
  };

  const onCrown = async (entryId) => {
    setError(null);
    try {
      await api(`/api/admin/drill/${entryId}/winner`, { method: "POST", body: "{}" });
      await load(date, true);
    } catch (e) {
      setError(e.message);
    }
  };

  const onImageSaved = (entryId, field, url) => {
    const key = field === "photo" ? "photoUrl" : "logoUrl";
    setPayload((p) => p && { ...p, entries: p.entries.map((e) => (e.id === entryId ? { ...e, [key]: url } : e)) });
  };

  if (loading && !payload) return <section className="mb-10"><h2 className="font-serif text-2xl mb-4">Strata Daily Drill</h2><p className="text-slate-400 text-sm">Loading…</p></section>;

  const pending = payload ? payload.entries.filter((e) => e.isCorrect === null) : [];
  const judged = payload ? payload.entries.filter((e) => e.isCorrect !== null) : [];
  const liveTask = payload && payload.launch ? payload.tasks.find((t) => t.id === payload.launch.taskId) : null;

  return (
    <section className="mb-10">
      <h2 className="font-serif text-2xl mb-4">Strata Daily Drill</h2>

      <div className="flex items-center gap-2 mb-6">
        <button onClick={() => shiftDate(-1)} className="px-2 py-1 rounded border border-slate-300 text-sm hover:bg-slate-50">&larr;</button>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} max={brisbaneToday()} className="border border-slate-300 rounded px-2 py-1 text-sm" />
        <button onClick={() => shiftDate(1)} disabled={date >= brisbaneToday()} className="px-2 py-1 rounded border border-slate-300 text-sm hover:bg-slate-50 disabled:opacity-40">&rarr;</button>
        {!isToday && (
          <button onClick={() => setDate(brisbaneToday())} className="text-xs text-teal-700 hover:underline">Today</button>
        )}
      </div>

      {error && <p className="text-rose-600 text-sm mb-4">{error}</p>}

      {payload && (
        <>
          {isToday && (
            <div className={`rounded-xl p-4 mb-6 border-2 ${payload.launch ? "bg-teal-50 border-teal-300" : "bg-amber-50 border-amber-300"}`}>
              {payload.launch ? (
                <>
                  <p className="text-xs font-bold uppercase tracking-wide text-teal-800">Live now — launched {brisbaneTime(payload.launch.launchedAt)}</p>
                  <p className="text-sm font-semibold text-slate-900 mt-1">{liveTask ? liveTask.title : `Question ${payload.launch.taskId}`}</p>
                  {payload.entries.length === 0 && (
                    <button onClick={unlaunch} className="mt-2 text-xs font-extrabold uppercase tracking-wide px-3 py-1.5 rounded-full bg-slate-900 text-white hover:bg-slate-700">Take offline</button>
                  )}
                </>
              ) : (
                <>
                  <p className="text-xs font-bold uppercase tracking-wide text-amber-800">Not launched yet</p>
                  <p className="text-sm text-slate-900 mt-1">The public page is showing "goes live at 9am". Pick a question below and hit Launch.</p>
                </>
              )}
            </div>
          )}

          <DrillManualWinner date={date} hasLaunch={!!payload.launch} onAdded={() => load(date, true)} />

          {isToday && library && <DrillAudioUploader library={library.tasks} onDone={loadLibrary} />}

          {isToday && library && (
            <DrillQuestionBank
              library={library.tasks}
              launch={payload.launch}
              hasSubmissions={payload.entries.length > 0}
              onLaunch={launchTask}
              busyId={busyId}
              onAudioChanged={loadLibrary}
            />
          )}

          {payload.tasks.length > 0 && (
            <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6">
              <button onClick={() => setTasksOpen((o) => !o)} className="text-xs font-bold uppercase tracking-wide text-amber-700">
                {tasksOpen ? "▾" : "▸"} {isToday ? "Today's question" : "That day's question"}
              </button>
              {tasksOpen && (
                <div className="mt-3 space-y-3">
                  {payload.tasks.map((t) => (
                    <div key={t.id} className="border-t border-slate-200 pt-2">
                      <p className="text-sm font-semibold text-slate-900">{t.title}</p>
                      <p className="text-xs text-slate-500 mb-1">{t.section}</p>
                      <p className="text-sm text-slate-700 whitespace-pre-wrap">{t.scenario}</p>
                      <p className="text-sm text-slate-700 whitespace-pre-wrap mt-1">{t.instructions}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <h3 className="font-semibold text-slate-900 mb-2">Pending review ({pending.length})</h3>
          {pending.length === 0 ? (
            <p className="text-sm text-slate-400 mb-6">Nothing waiting on a verdict.</p>
          ) : (
            <div className="space-y-2 mb-8">
              {pending.map((e) => (
                <DrillEntryReview key={e.id} entry={e} tasks={payload.tasks} onVerdict={onVerdict} onImageSaved={onImageSaved} onCrown={onCrown} />
              ))}
            </div>
          )}

          <h3 className="font-semibold text-slate-900 mb-2">Judged ({judged.length}) — fastest first</h3>
          {judged.length === 0 ? (
            <p className="text-sm text-slate-400">Nothing judged yet.</p>
          ) : (
            <div className="space-y-2">
              {judged.map((e) => (
                <DrillEntryReview key={e.id} entry={e} tasks={payload.tasks} onVerdict={onVerdict} onImageSaved={onImageSaved} onCrown={onCrown} />
              ))}
            </div>
          )}
        </>
      )}
    </section>
  );
}

function AdminApp() {
  const [data, setData] = useState(emptyData);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [unlocked, setUnlocked] = useState(false);

  useEffect(() => {
    const supplied = window.prompt("Admin password");
    if (supplied === "admin") setUnlocked(true);
  }, []);

  const refresh = async () => {
    try {
      const fresh = await api("/api/admin/data");
      setData(fresh);
      setLoadError(null);
    } catch (e) {
      setLoadError(e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    if (!unlocked) return;
    refresh();
  }, [unlocked]);

  if (!unlocked) return <div className="p-10 text-center"><h1 className="font-serif text-3xl">Access Denied</h1><a href="index.html" className="text-teal-700 underline">Back</a></div>;

  return (
    <div className="min-h-screen bg-stone-50 text-slate-900">
      <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <header className="border-b-2 border-slate-900 pb-4 mb-6 flex flex-col sm:flex-row sm:justify-between sm:items-end gap-1">
          <h1 className="font-serif text-3xl sm:text-4xl">Admin Dashboard</h1>
          <a href="index.html" className="text-sm text-teal-700 hover:underline">View public rankings →</a>
        </header>
        {loadError && (
          <div className="mb-6 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">
            Couldn't reach the rankings server: {loadError}
          </div>
        )}
        {loading ? <p>Loading…</p> : <AdminPanel data={data} refresh={refresh} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminApp />);
