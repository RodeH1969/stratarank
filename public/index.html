const { useState, useEffect, useMemo, useRef } = React;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayStr = () => new Date().toISOString().slice(0, 10);
const yearOf = (dateStr) => new Date(dateStr).getFullYear();
const BCCM_MODULES = [
  "Standard Module",
  "Accommodation Module",
  "Commercial Module",
  "Small Schemes Module",
  "Specified Two-lot Schemes Module",
];
const schemeLabel = (scheme) => {
  if (!scheme) return "Building";
  const parts = [scheme.suburb, scheme.planType, scheme.module, scheme.lotCount ? `${scheme.lotCount} lots` : null].filter(Boolean);
  return parts.length ? parts.join(" · ") : "Building";
};
const formatDate = (dateStr) => {
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
};

// Weekly cycle runs Mon–Sun on Brisbane local time (QLD has no daylight
// saving, so this is a fixed UTC+10 offset year-round — no DST edge cases).
const brisbaneToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "Australia/Brisbane" });
const mondayOf = (dateStr) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const dow = dt.getUTCDay(); // 0=Sun..6=Sat
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  dt.setUTCDate(dt.getUTCDate() + diffToMonday);
  return dt.toISOString().slice(0, 10);
};
const weekRangeLabel = (mondayStr) => {
  const [y, m, d] = mondayStr.split("-").map(Number);
  const monday = new Date(Date.UTC(y, m - 1, d));
  const sunday = new Date(Date.UTC(y, m - 1, d + 6));
  const fmt = (dt) => dt.toLocaleDateString("en-AU", { day: "numeric", month: "short", timeZone: "UTC" });
  return `${fmt(monday)} – ${fmt(sunday)}`;
};

// Milliseconds until the end of this week (Sun 23:59:59 Brisbane time).
const msUntilWeekEnd = (mondayStr) => {
  const [y, m, d] = mondayStr.split("-").map(Number);
  // Brisbane is a fixed UTC+10 year-round — end of Sunday there is 13:59:59 UTC.
  const sundayEndUTC = Date.UTC(y, m - 1, d + 6, 13, 59, 59);
  return sundayEndUTC - Date.now();
};
const countdownLabel = (ms) => {
  if (ms <= 0) return "Ends today";
  const days = Math.floor(ms / (1000 * 60 * 60 * 24));
  const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);
  if (days > 0) return `${days} day${days === 1 ? "" : "s"} ${hours}h left`;
  return `${hours}h left`;
};
const msUntilSeasonEnd = (seasonYear) => {
  const endUTC = Date.UTC(seasonYear, 11, 22, 13, 59, 59); // Dec 22, Brisbane 23:59:59
  return endUTC - Date.now();
};
const daysUntilLabel = (ms) => {
  if (ms <= 0) return "Season closed";
  const days = Math.ceil(ms / (1000 * 60 * 60 * 24));
  return `${days} day${days === 1 ? "" : "s"} left this season`;
};

const elapsedLabel = (seconds) => {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
};

// Monthly cycle — calendar month on Brisbane local time.
const monthKeyOf = (dateStr) => dateStr.slice(0, 7); // "YYYY-MM"
const monthLabel = (monthKey) => {
  const [y, m] = monthKey.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("en-AU", { month: "long", year: "numeric", timeZone: "UTC" });
};
// Milliseconds until the end of this calendar month (last day 23:59:59 Brisbane time).
const msUntilMonthEnd = (monthKey) => {
  const [y, m] = monthKey.split("-").map(Number);
  // First day of next month, UTC, minus 1 second, adjusted for Brisbane's fixed UTC+10.
  const nextMonthStartUTC = Date.UTC(y, m, 1, 0, 0, 0) - 10 * 60 * 60 * 1000;
  return nextMonthStartUTC - Date.now();
};

const dealTermLabel = (ev) => {
  const yrs = (n) => `${n} year${n === 1 ? "" : "s"}`;
  if (ev.type === "renewal") {
    if (ev.prevTerm && ev.prevTerm !== ev.newTerm) return `${yrs(ev.prevTerm)} converted to ${ev.newTerm} Year Renewal`;
    return `${ev.newTerm} Year Renewal`;
  }
  return `Signed a new ${yrs(ev.newTerm)} term`;
};

// "Tip source" banner — set by admin only, never by the public tip-off

}

// "VERIFIED" stamp — shown on every win once admin has approved it

    </div>

}

function computePoints(type, newTerm, prevTerm) {
  const t = Number(newTerm);
  const p = prevTerm != null && prevTerm !== "" ? Number(prevTerm) : null;
  if (type === "competitor") {
    if (t === 3) return 10;
    if (t === 2) return 9;
    if (t === 1) return 8;
    return 0;
  }
  if (type === "renewal") {
    if (t === 3) {
      if (p === 1 || p === 2) return 7;
      if (p === 3) return 3;
      return 0;
    }
    if (t === 2) return 2;
    if (t === 1) return 1;
    return 0;
  }
  return 0;
}

async function api(path, options) {
  // Render's containers occasionally take a minute or two to fully settle
  // right after a fresh deploy, which can cause a brief run of server-side
  // failures. Retry those silently with backoff before ever surfacing an
  // error — but never retry a genuine validation error (4xx), since that's
  // real input feedback the person needs to see immediately.
  const maxAttempts = 6;
  let delay = 2000;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    let res;
    try {
      res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options && options.headers) },
      });
    } catch (networkErr) {
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay * 2, 20000);
        continue;
      }
      throw networkErr;
    }
    const body = await res.json().catch(() => ({}));
    if (res.ok) return body;
    const message = body.error || `Request failed (${res.status})`;
    if (res.status >= 500 && attempt < maxAttempts) {
      await new Promise((r) => setTimeout(r, delay));
      delay = Math.min(delay * 2, 20000);
      continue;
    }
    throw new Error(message);
  }
}

function App() {
  const [data, setData] = useState(emptyData);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [tab, setTab] = useState("drill");
  const [showLaureateInfo, setShowLaureateInfo] = useState(false);

  const refresh = async () => {
    try {
      const fresh = await api("/api/data");
      setData(fresh);
      setLoadError(null);
    } catch (e) {
      setLoadError(e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const managerById = (id) => data.managers.find((m) => m.id === id);
  const schemeById = (id) => data.schemes.find((s) => s.id === id);

  // Every approved win grouped into its calendar month, with that month's
  // leader worked out by points (lots break ties).
  const monthlyWinners = useMemo(() => {
    const approved = data.events.filter((e) => e.status === "approved");
    const byMonth = {};
    for (const ev of approved) {
      const mk = monthKeyOf(ev.date);
      if (!byMonth[mk]) byMonth[mk] = {};
      if (!byMonth[mk][ev.managerId]) byMonth[mk][ev.managerId] = { points: 0, lots: 0, events: [] };
      byMonth[mk][ev.managerId].points += ev.points;
      const scheme = schemeById(ev.schemeId);
      byMonth[mk][ev.managerId].lots += scheme?.lotCount ? Number(scheme.lotCount) : 0;
      byMonth[mk][ev.managerId].events.push(ev);
    }
    const result = {};
    for (const mk of Object.keys(byMonth)) {
      const totals = Object.entries(byMonth[mk])
        .map(([managerId, t]) => ({ managerId, ...t }))
        .sort((a, b) => b.points - a.points || b.lots - a.lots);
      result[mk] = { winnerManagerId: totals[0].managerId, totals };
    }
    return result;
  }, [data]);

  const currentMonthKey = monthKeyOf(brisbaneToday());

  // Season leaderboard: ranks managers by total points accumulated across
  // every approved win this season (not by count of monthly wins). Ties on
  // points are broken by total lots across all those wins.
  const seasonStandings = useMemo(() => {
    const approved = data.events.filter((e) => e.status === "approved" && yearOf(e.date) === data.seasonYear);
    const byManager = {};
    for (const ev of approved) {
      if (!byManager[ev.managerId]) byManager[ev.managerId] = { points: 0, lots: 0, monthTotals: {} };
      const scheme = schemeById(ev.schemeId);
      const evLots = scheme?.lotCount ? Number(scheme.lotCount) : 0;
      byManager[ev.managerId].points += ev.points;
      byManager[ev.managerId].lots += evLots;
      const mk = monthKeyOf(ev.date);
      if (!byManager[ev.managerId].monthTotals[mk]) byManager[ev.managerId].monthTotals[mk] = { points: 0, lots: 0 };
      byManager[ev.managerId].monthTotals[mk].points += ev.points;
      byManager[ev.managerId].monthTotals[mk].lots += evLots;
    }
    return Object.entries(byManager)
      .map(([managerId, t]) => ({
        manager: managerById(managerId),
        points: t.points,
        lots: t.lots,
        months: Object.entries(t.monthTotals)
          .sort((a, b) => (a[0] < b[0] ? -1 : 1))
          .map(([monthKey, mt]) => ({ monthKey, points: mt.points, lots: mt.lots })),
      }))
      .filter((row) => row.manager)
      .sort((a, b) => b.points - a.points || b.lots - a.lots);
  }, [data]);

  // Movement indicator: rank as of last month (excluding wins recorded in
  // the still-open current month) compared to today's rank. Uses the same
  // points-then-lots tiebreak as seasonStandings so the ▲▼ arrows agree.
  const previousRankMap = useMemo(() => {
    const approved = data.events.filter(
      (e) => e.status === "approved" && yearOf(e.date) === data.seasonYear && monthKeyOf(e.date) !== currentMonthKey
    );
    const points = {};
    const lots = {};
    for (const ev of approved) {
      const scheme = schemeById(ev.schemeId);
      points[ev.managerId] = (points[ev.managerId] || 0) + ev.points;
      lots[ev.managerId] = (lots[ev.managerId] || 0) + (scheme?.lotCount ? Number(scheme.lotCount) : 0);
    }
    const ordered = Object.entries(points).sort((a, b) => b[1] - a[1] || (lots[b[0]] || 0) - (lots[a[0]] || 0));
    const map = {};
    ordered.forEach(([managerId], i) => { map[managerId] = i + 1; });
    return map;
  }, [data, currentMonthKey]);

  const currentMonth = monthlyWinners[currentMonthKey];
  const currentMonthEntries = currentMonth
    ? currentMonth.totals.map((t) => ({ manager: managerById(t.managerId), ...t })).filter((r) => r.manager)
    : [];

  const sortedEvents = useMemo(
    () => [...data.events].filter((e) => yearOf(e.date) === data.seasonYear).sort((a, b) => new Date(b.date) - new Date(a.date)),
    [data]
  );

  return (
    <div className="min-h-screen bg-stone-50 text-slate-900">
      <div className="max-w-3xl mx-auto px-6 py-10">
        <header className="border-b-2 border-slate-900 pb-5 mb-8">
          <div className="mb-4 text-center">
            <h1 className="m-0">
              <img
                src="/qsr-logo.jpg"
                alt="QSR - Qld Strata Rankings"
                style={{ mixBlendMode: "multiply" }}
                className="mx-auto w-60 sm:w-72 h-auto block"
              />
            </h1>
            <p
              className="text-slate-800 mt-3 font-semibold whitespace-nowrap"
              style={{ fontSize: "clamp(0.7rem, 2.8vw, 1.25rem)" }}
            >
              Ranking ELITE strata managers across Qld
            </p>
          </div>
          <div className="flex flex-wrap items-center justify-center gap-2.5">
            <div className="w-full sm:w-auto flex flex-col items-center">
              <div className="relative w-full sm:w-auto">
                <button
                  onClick={() => setTab("drill")}
                  className={`gold-pulse-ring w-full sm:w-auto px-4 py-2.5 rounded-full text-sm font-extrabold whitespace-nowrap text-center text-slate-900 border-2 transition-colors ${
                    tab === "drill" ? "bg-amber-400 border-slate-900 shadow-md" : "bg-gradient-to-br from-amber-300 to-amber-500 border-amber-600 hover:from-amber-200 hover:to-amber-400"
                  }`}
                >
                  <span className="brain-pulse">🧠</span> Strata Laureate
                </button>
                <span className="absolute -top-2 right-4 sm:-right-3 bg-red-600 text-white text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full shadow pointer-events-none" style={{ letterSpacing: "0.1em" }}>Daily</span>
              </div>
              <button type="button" onClick={() => setShowLaureateInfo(true)} className="mt-1.5 text-xs font-semibold text-slate-600 underline underline-offset-2 hover:text-slate-900">
                ⓘ What's Strata Laureate?
              </button>
            </div>
            <div className="w-full sm:w-auto bg-slate-900 rounded-3xl px-2 pt-2.5 pb-2 sm:px-3 sm:pb-2.5 shadow-md">
            <div className="flex items-center justify-center gap-3 mb-2">
              <span className="h-px flex-1 bg-gradient-to-r from-transparent to-amber-400/70"></span>
              <p className="text-amber-400 font-extrabold uppercase text-xs sm:text-sm whitespace-nowrap" style={{ letterSpacing: "0.3em" }}>Deal Room</p>
              <span className="h-px flex-1 bg-gradient-to-l from-transparent to-amber-400/70"></span>
            </div>
            <nav className="grid grid-cols-2 sm:flex sm:flex-row sm:justify-center gap-1.5 sm:gap-1 w-full sm:w-auto">
              {[
                { id: "dotm", label: "Deal of the Month", shortLabel: "Deal of Month" },
                { id: "log", label: "Every Deal", shortLabel: "Every Deal" },
                { id: "season", label: "Season Leaderboard", shortLabel: "Leaderboard" },
                { id: "jobs", label: "💼 Jobs", shortLabel: "💼 Jobs" },
                { id: "report", label: "🔍 The Scoop", shortLabel: "🔍 The Scoop" },
              ].map(({ id, label, shortLabel }) => (
                <button
                  key={id}
                  onClick={() => setTab(id)}
                  className={
                    id === "report"
                      ? `col-span-2 sm:col-span-1 px-3 py-2.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-full text-xs sm:text-sm font-extrabold whitespace-nowrap text-center text-slate-900 ${tab === id ? "claim-tab-active" : "claim-tab"}`
                      : `px-3 py-2.5 sm:px-3 sm:py-2 rounded-xl sm:rounded-full text-xs sm:text-sm font-medium whitespace-nowrap text-center transition-colors ${tab === id ? "bg-amber-500 text-slate-900" : "text-stone-200 hover:text-white"}`
                  }
                >
                  <span className="sm:hidden">{shortLabel}</span>
                  <span className="hidden sm:inline">{label}</span>
                </button>
              ))}
            </nav>
            </div>
          </div>
          {tab !== "drill" && tab !== "jobs" && <MetricInfoButton />}
          {showLaureateInfo && <DrillInfoPopup onClose={() => setShowLaureateInfo(false)} />}
        </header>

        {loadError && (
          <div className="mb-6 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">
            Couldn't reach the rankings server: {loadError}
          </div>
        )}

        {loading ? (
          <SkeletonLoader />
        ) : tab === "dotm" ? (
          <WinOfTheMonth monthKey={currentMonthKey} entries={currentMonthEntries} agencyLogos={data.agencyLogos} sponsors={data.sponsors} schemeById={schemeById} sponsorInvites={data.sponsorInvites} />
        ) : tab === "log" ? (
          <EventLog events={sortedEvents} managerById={managerById} schemeById={schemeById} agencyLogos={data.agencyLogos} sponsorInvites={data.sponsorInvites} />
        ) : tab === "season" ? (
          <SeasonLeaderboard standings={seasonStandings} agencyLogos={data.agencyLogos} sponsors={data.sponsors} previousRankMap={previousRankMap} seasonYear={data.seasonYear} />
        ) : tab === "drill" ? (
          <DailyDrill />
        ) : tab === "jobs" ? (
          <JobsBoard />
        ) : (
          <ReportWin data={data} refresh={refresh} />
        )}
      </div>
    </div>
  );
}

function AgencyBadge({ agency, agencyLogos, size }) {

  const match = (agencyLogos || {})[key];
  const logoSize = size || "h-6";
  const badgeSize = size ? "h-16 min-w-16 text-lg" : "h-6 min-w-6 text-[10px]";

  if (match && match.logoUrl) {
    const logo = <img src={match.logoUrl} alt={agency} className={`${logoSize} w-auto object-contain shrink-0`} />;
    return match.websiteUrl ? (
      <a href={match.websiteUrl} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="shrink-0 hover:opacity-80 transition-opacity">
        {logo}
      </a>

function ShareButton({ text }) {
  const [copied, setCopied] = useState(false);
  const url = typeof window !== "undefined" ? window.location.href : "";

  const shareNative = async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: "QLD Strata Rankings", text, url });
        return;
      } catch (e) {
        // user cancelled or share failed — fall through to LinkedIn/copy below
      }
    }
    const linkedInUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`;
    window.open(linkedInUrl, "_blank", "noopener,noreferrer");
  };

  return (
    <button
      onClick={shareNative}
      className="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm px-4 py-2 rounded-full shadow-md transition-colors"
    >

// The site's featured card: current month's leading manager by points
// (lots break ties). Eligibility rule is stricter than a plain deal —
// the contract must be passed at an AGM held within the current month.
function WinOfTheMonth({ monthKey, entries, sponsors, agencyLogos, schemeById, sponsorInvites }) {
  const [, forceTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => forceTick((n) => n + 1), 60000);
    return () => clearInterval(id);
  }, []);

  const sorted = [...entries].sort((a, b) => b.points - a.points || b.lots - a.lots);
  const leader = sorted[0];
  const others = sorted.slice(1);
  const leaderDeals = leader
    ? leader.events.map((ev) => ({ event: ev, scheme: schemeById(ev.schemeId) })).filter((d) => d.scheme)
    : [];
  const leaderTrades = leader
    ? leader.events
        .flatMap((ev) => (sponsorInvites || []).filter((inv) => inv.eventId === ev.id && inv.status === "accepted" && inv.logoUrl))
        .slice(0, 5)
    : [];
  const shareText = leader
    ? `${leader.manager.name} is leading the QLD Strata Rankings this month with ${leader.points} points!`
    : "";

  return (
    <div>
      {!leader ? (
        <div className="text-center py-16">
          <p className="text-center text-base sm:text-lg font-bold text-slate-700 mb-4">{monthLabel(monthKey)}</p>
          <p className="font-serif text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">No deal of the month yet!</p>
          <p className="text-lg sm:text-xl font-bold text-amber-600 mb-6">If you nailed a deal this month, let the strata world know!</p>
          <div className="flex justify-center">
            <div className="inline-flex items-center gap-2 bg-white border-2 border-amber-400 rounded-full px-4 sm:px-5 py-2 shadow-md">
              <span className="text-base sm:text-lg">🏆</span>
              <span className="font-extrabold text-sm sm:text-base text-slate-900">Up for grabs —</span>
              <img src="/prizes/dan-murphys.jpg" alt="Dan Murphy's" className="h-16 sm:h-20 inline-block" onError={(e) => { e.target.style.display = "none"; }} />
              <span className="font-extrabold text-sm sm:text-base text-slate-900">$100 voucher!</span>
            </div>
          </div>
        </div>
      ) : (
        <>
          <div className="relative bg-gradient-to-br from-amber-50 to-amber-100 border-2 border-amber-300 rounded-2xl p-5 sm:p-8 shadow-sm">
            {leaderDeals[0]?.event?.status === "approved" && <VerifiedStamp />}
            <TipSash tipSource={leaderDeals[0]?.event?.tipSource} />
            <p className="text-center text-base sm:text-lg font-bold text-slate-700 mb-1">{monthLabel(monthKey)}</p>
            <p className="text-center text-xs sm:text-sm font-semibold text-rose-600 mb-3">⏱ {countdownLabel(msUntilMonthEnd(monthKey))}</p>
            <p className="text-center text-xs sm:text-sm font-bold uppercase tracking-wide text-amber-700 mb-1">Current leader — month's still open</p>
            <p className="text-center text-[11px] sm:text-xs font-bold text-teal-700 mb-5">Contract must be passed at an AGM held this month to count.</p>

            <div className="text-center">
              {leader.manager.photoUrl ? (
                <img
                  src={leader.manager.photoUrl}
                  alt={leader.manager.name}
                  className="w-32 h-32 sm:w-44 sm:h-44 rounded-full object-cover mx-auto border-4 border-white shadow-lg"
                />
              ) : (
                <div className="w-32 h-32 sm:w-44 sm:h-44 rounded-full bg-slate-200 flex items-center justify-center mx-auto text-4xl sm:text-5xl font-bold text-slate-500 border-4 border-white shadow-lg">
                  {leader.manager.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()}

              )}

              <div className="flex justify-center mt-5">
                <AgencyBadge agency={leader.manager.agency} agencyLogos={agencyLogos} size="h-16 sm:h-20" />
              </div>

              <h2 className="font-serif text-3xl sm:text-4xl mt-4">{leader.manager.name}</h2>

                  className="inline-flex items-center gap-1.5 mt-3 text-sm font-semibold text-[#0A66C2] bg-white px-3 py-1.5 rounded-full shadow-sm hover:shadow transition-shadow"
                >
                  <LinkedInIcon /> View on LinkedIn

              )}

            <div className="mt-6 bg-white/80 rounded-xl p-4 sm:p-6 text-center">
              {leaderDeals.map(({ event, scheme }, i) => (
                <div key={i} className={i > 0 ? "mt-4 pt-4 border-t border-amber-100" : ""}>
                  <p className="font-serif text-2xl sm:text-3xl font-bold text-slate-900">{dealTermLabel(event)}</p>
                  <p className="text-xs sm:text-sm font-bold text-amber-800 mt-1.5 tracking-wide">{leader.points} Ranking Points</p>
                  <p className="text-sm sm:text-base text-slate-700 mt-2">
                    {scheme.suburb}
                    {[scheme.planType, scheme.module].filter(Boolean).length ? ` · ${[scheme.planType, scheme.module].filter(Boolean).join(" · ")}` : ""}

                <span className="font-extrabold text-sm sm:text-base text-slate-900">Leading the pack for a</span>

              </div>

            {leaderTrades.length > 0 && (
              <div className="mt-6 bg-slate-900 rounded-2xl p-5 sm:p-6 shadow-lg">
                <p className="text-center text-xs sm:text-sm font-extrabold uppercase tracking-widest text-amber-400 mb-4">

                </p>
                <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4">
                  {leaderTrades.map((t) => {
                    const pair = (
                      <div className="flex items-center gap-2 bg-white rounded-lg px-3 py-2 shadow-md">
                        {t.iconUrl && <img src={t.iconUrl} alt="" className="h-6 w-6 sm:h-8 sm:w-8 object-contain shrink-0" />}
                        <img src={t.logoUrl} alt={t.businessName} title={t.tagline ? `${t.businessName} — ${t.tagline}` : t.businessName} className="h-8 sm:h-10 max-w-[100px] sm:max-w-[130px] object-contain" />
                      </div>
                    );
                    return t.websiteUrl ? (
                      <a key={t.id} href={t.websiteUrl} target="_blank" rel="noopener noreferrer" className="hover:opacity-90 transition-opacity">
                        {pair}
                      </a>
                    ) : (
                      <div key={t.id}>{pair}</div>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="mt-6 flex justify-center">
              <ShareButton text={shareText} />
            </div>
          </div>

          {others.length > 0 && (
            <div className="mt-6">
              <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-3">Also in the running this month</p>
              <div className="space-y-2">
                {others.map((row) => (
                  <div key={row.managerId} className="flex items-center gap-3 py-2 px-3 border border-slate-200 rounded-lg">
                    <AgencyBadge agency={row.manager.agency} agencyLogos={agencyLogos} />
                    <ManagerPhotoPopup manager={row.manager}>
                      <div className="min-w-0">
                        <p className="font-medium text-sm truncate hover:underline decoration-dotted">{row.manager.name}</p>
                      </div>
                    </ManagerPhotoPopup>
                    <div className="ml-auto text-right shrink-0">
                      <span className="font-serif text-lg">{row.points}</span>
                      <span className="text-xs text-slate-500 ml-1">({row.events.length} · {row.lots} lots)</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
      <SponsorStrip sponsors={sponsors} />
    </div>
  );
}

  return (
    <div>
      <div className="gold-pulse-ring bg-gradient-to-br from-amber-300 to-amber-500 border-4 border-amber-600 rounded-2xl px-5 sm:px-8 py-5 sm:py-6 mb-6 shadow-lg text-center">
        <p className="text-xl sm:text-3xl font-extrabold text-slate-900 flex items-center justify-center gap-2 flex-wrap">

function EventLog({ events, managerById, schemeById, agencyLogos, sponsorInvites }) {
  const [query, setQuery] = useState("");
  const findWinSponsors = (eventId) =>
    (sponsorInvites || []).filter((inv) => inv.eventId === eventId && inv.status === "accepted" && inv.logoUrl).slice(0, 5);

  const isNew = (ev) => {
    if (!ev.createdAt) return false;
    return Date.now() - new Date(ev.createdAt).getTime() < 24 * 60 * 60 * 1000;
  };

  const filteredEvents = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return events;
    return events.filter((ev) => {
      const manager = managerById(ev.managerId);
      const scheme = schemeById(ev.schemeId);
      const haystack = `${manager?.name || ""} ${manager?.agency || ""} ${scheme?.suburb || ""}`.toLowerCase();
      return haystack.includes(q);
    });
  }, [events, query]);

  const monthGroups = useMemo(() => {
    const byMonth = {};
    for (const ev of filteredEvents) {
      const mk = monthKeyOf(ev.date);
      if (!byMonth[mk]) byMonth[mk] = [];
      byMonth[mk].push(ev);
    }
    return Object.keys(byMonth)
      .sort((a, b) => (a < b ? 1 : -1))
      .map((mk) => {
        const ranked = [...byMonth[mk]].sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          const lotsA = schemeById(a.schemeId)?.lotCount || 0;
          const lotsB = schemeById(b.schemeId)?.lotCount || 0;
          return lotsB - lotsA;
        });
        return { monthKey: mk, events: ranked };
      });
  }, [filteredEvents]);

  return (
    <div>
      <input
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        placeholder="Search by manager, agency, or suburb…"
        className="w-full border border-slate-300 rounded-full px-4 py-2 text-sm mb-6 bg-white"
      />
      {events.length === 0 ? (
        <p className="text-slate-500 text-center py-16">No deals reported yet.</p>
      ) : monthGroups.length === 0 ? (
        <p className="text-slate-500 text-center py-16">No deals match "{query}".</p>
      ) : (
        <div className="space-y-8">
          {monthGroups.map((group) => (
            <div key={group.monthKey}>
              <p className="text-sm font-bold text-slate-700 mb-3">{monthLabel(group.monthKey)}</p>
              <div className="space-y-4">
                {group.events.map((ev, idx) => {
            const manager = managerById(ev.managerId);
            const scheme = schemeById(ev.schemeId);
            const sponsors = findWinSponsors(ev.id);
            return (
              <div key={ev.id} className="flex items-start gap-2 sm:gap-3">
                <div className="font-serif text-lg sm:text-xl text-slate-400 w-6 shrink-0 pt-4 text-right">{idx + 1}.</div>
                <div className={`flex-1 min-w-0 bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm hover:shadow-md transition-shadow relative ${ev.status === "approved" ? "sm:pr-20" : ""}`}>
                {ev.status === "approved" && <VerifiedStamp />}
                <TipSash tipSource={ev.tipSource} />
                {isNew(ev) && (
                  <span className="absolute -top-2 -left-2 bg-rose-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-sm">NEW</span>
                )}
                <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 sm:gap-4">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <AgencyBadge agency={manager?.agency} agencyLogos={agencyLogos} />
                    <ManagerPhotoPopup manager={manager}>
                      <div className="min-w-0">
                        <p className="font-semibold text-base text-slate-900 truncate hover:underline decoration-dotted">{manager?.name || "Unknown"}</p>
                      </div>
                    </ManagerPhotoPopup>
                  </div>

                  <div className="sm:flex-1 sm:min-w-[140px]">
                    <p className="text-base font-semibold text-slate-800">{scheme?.suburb || "Building"}</p>
                    <p className="text-sm text-slate-500 mt-0.5">{[scheme?.planType, scheme?.module].filter(Boolean).join(" · ")}</p>
                    {scheme?.lotCount ? <p className="text-sm text-slate-500 mt-0.5">{scheme.lotCount} lots</p> : null}
                  </div>

                  <div className="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-start gap-2 sm:shrink-0">

function Stopwatch({ seconds, running, label }) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const sec = seconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  // Cumulative angles (never wrap back to 0) so the hand ticks forward
  // with a little mechanical overshoot instead of spinning backwards.
  const secDeg = seconds * 6;
  const minDeg = (seconds / 60) * 6;
  const ticks = Array.from({ length: 60 }, (_, i) => i);
  const cx = 100, cy = 112;
  const polar = (deg, r) => [cx + r * Math.sin((deg * Math.PI) / 180), cy - r * Math.cos((deg * Math.PI) / 180)];
  return (
    <div className="flex flex-col items-center">
      <svg viewBox="0 0 200 232" className={`w-44 sm:w-52 ${running ? "sw-running" : "sw-stopped"}`} role="img" aria-label={`Stopwatch: ${elapsedLabel(seconds)}`}>
        <defs>
          <linearGradient id="swBrass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="#fde68a" />
            <stop offset="0.45" stopColor="#d97706" />
            <stop offset="1" stopColor="#78350f" />
          </linearGradient>
          <radialGradient id="swFace" cx="0.5" cy="0.4" r="0.7">
            <stop offset="0" stopColor="#fffdf5" />
            <stop offset="1" stopColor="#fef3c7" />
          </radialGradient>
        </defs>
        {/* crown + side button */}
        <g className={running ? "sw-crown" : ""}>
          <rect x="88" y="4" width="24" height="12" rx="3" fill="url(#swBrass)" stroke="#78350f" strokeWidth="1" />
          <rect x="94" y="14" width="12" height="12" fill="url(#swBrass)" stroke="#78350f" strokeWidth="1" />
        </g>
        <rect x="152" y="30" width="12" height="20" rx="3" fill="url(#swBrass)" stroke="#78350f" strokeWidth="1" transform="rotate(40 158 40)" />
        {/* case */}
        <circle cx={cx} cy={cy} r="88" fill="url(#swBrass)" stroke="#78350f" strokeWidth="2" />
        <circle cx={cx} cy={cy} r="78" fill="#78350f" opacity="0.35" />
        <circle cx={cx} cy={cy} r="75" fill="url(#swFace)" stroke="#92400e" strokeWidth="1.5" />
        {/* ticks */}
        {ticks.map((i) => {
          const major = i % 5 === 0;
          const [x1, y1] = polar(i * 6, major ? 60 : 66);
          const [x2, y2] = polar(i * 6, 71);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={major ? "#78350f" : "#b45309"} strokeWidth={major ? 2.2 : 0.9} strokeLinecap="round" />;
        })}
        {[0, 15, 30, 45].map((n) => {
          const [x, y] = polar(n * 6, 50);
          return <text key={n} x={x} y={y + 4} textAnchor="middle" fontSize="11" fontWeight="800" fill="#78350f" fontFamily="Georgia, serif">{n === 0 ? 60 : n}</text>;
        })}
        {/* minutes sub-dial */}
        <circle cx={cx} cy={cy + 26} r="16" fill="#fffbeb" stroke="#b45309" strokeWidth="1" />
        {Array.from({ length: 12 }, (_, i) => {
          const a = i * 30;
          const x1 = cx + 13 * Math.sin((a * Math.PI) / 180), y1 = cy + 26 - 13 * Math.cos((a * Math.PI) / 180);
          const x2 = cx + 16 * Math.sin((a * Math.PI) / 180), y2 = cy + 26 - 16 * Math.cos((a * Math.PI) / 180);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#92400e" strokeWidth="0.8" />;
        })}
        <line x1={cx} y1={cy + 26} x2={cx} y2={cy + 15} stroke="#78350f" strokeWidth="1.6" strokeLinecap="round" style={{ transform: `rotate(${minDeg}deg)`, transformOrigin: `${cx}px ${cy + 26}px`, transition: "transform 0.4s cubic-bezier(.4,2.2,.5,1)" }} />
        <circle cx={cx} cy={cy + 26} r="1.8" fill="#78350f" />
        <text x={cx} y={cy - 22} textAnchor="middle" fontSize="7" fontWeight="800" letterSpacing="2" fill="#b45309">STRATA</text>
        {/* second hand */}
        <g style={{ transform: `rotate(${secDeg}deg)`, transformOrigin: `${cx}px ${cy}px`, transition: running ? "transform 0.3s cubic-bezier(.4,2.4,.5,1)" : "none" }}>
          <line x1={cx} y1={cy + 14} x2={cx} y2={cy - 64} stroke="#dc2626" strokeWidth="1.8" strokeLinecap="round" />
          <circle cx={cx} cy={cy - 64} r="2.2" fill="#dc2626" />
        </g>
        <circle cx={cx} cy={cy} r="4.5" fill="#dc2626" stroke="#7f1d1d" strokeWidth="1" />
        <circle cx={cx} cy={cy} r="1.5" fill="#fef2f2" />
        {/* glass glint */}
        <path d="M44 70 A62 62 0 0 1 100 48" fill="none" stroke="#fff" strokeOpacity="0.55" strokeWidth="5" strokeLinecap="round" />
      </svg>
      <div className="-mt-1 px-4 py-1.5 rounded-lg bg-slate-900 border border-amber-500/60 shadow-inner">
        <span className="font-mono text-xl sm:text-2xl font-bold tracking-widest" style={{ color: running ? "#fbbf24" : "#5eead4", textShadow: running ? "0 0 8px rgba(251,191,36,0.6)" : "0 0 8px rgba(94,234,212,0.6)" }}>
          {pad(h)}:{pad(m)}:{pad(sec)}
        </span>
      </div>
      <p className="mt-1.5 text-[11px] font-extrabold uppercase tracking-[0.25em] text-amber-900">{label || (running ? "Clock's running" : "Stopped")}</p>
    </div>
  );
}

    const full = `${text} ${window.location.origin}`;

      try {
        await navigator.share({ text: full });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(full);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      window.prompt("Copy this to share:", full);
    }
  };
  return (
    <button
      type="button"
      onClick={share}

function DrillAudioBrain() {
  const [current, setCurrent] = useState(null); // scenario | question | null
  const [playing, setPlaying] = useState(false);
  const [heard, setHeard] = useState({ scenario: false, question: false });
  const [audioError, setAudioError] = useState(null);
  const clips = useRef({});

  const clip = (name) => {
    if (!clips.current[name]) {
      const a = new Audio(`/api/drill/audio/${name}`);
      a.preload = "auto";
      a.onended = () => { setPlaying(false); setHeard((h) => ({ ...h, [name]: true })); };
      a.onerror = () => { setPlaying(false); setAudioError("Couldn't load the audio. Try again."); };
      clips.current[name] = a;
    }
    return clips.current[name];
  };

  useEffect(() => () => {
    Object.values(clips.current).forEach((a) => { a.pause(); a.src = ""; });
  }, []);

  // One button per clip: tap to play (restarts if it had finished), tap again to pause.
  const toggle = (name) => {
    const a = clip(name);
    if (current === name && playing) { a.pause(); setPlaying(false); return; }
    Object.entries(clips.current).forEach(([k, x]) => { if (k !== name) x.pause(); });
    if (current !== name || a.ended) a.currentTime = 0;
    setCurrent(name);
    setAudioError(null);
    a.play().then(() => setPlaying(true)).catch(() => { setPlaying(false); setAudioError("Tap again to start the audio."); });
  };

  const btn = (name, label) => {
    const on = current === name && playing;
    return (
      <button
        onClick={() => toggle(name)}
        className={`rounded-full px-3 sm:px-4 py-1.5 sm:py-2 text-xs sm:text-sm font-extrabold inline-flex items-center gap-1.5 border-2 ${on ? "bg-amber-400 text-slate-900 border-slate-900" : "bg-slate-900 text-amber-400 border-slate-900"} ${current === null && name === "scenario" ? "gold-pulse-ring" : ""}`}
      >
        {on ? "❚❚" : heard[name] ? "↻" : "▶"} {label}
      </button>
    );
  };

  const bars = Array.from({ length: 22 }, (_, i) => (
    <i key={i} className="drill-bar" style={{ animationDelay: `${(i * 0.13) % 0.9}s`, animationDuration: `${0.7 + ((i * 37) % 5) / 10}s` }} />

  const shapes = (
    <>
      <ellipse cx="300" cy="215" rx="252" ry="125" /><circle cx="130" cy="150" r="85" /><circle cx="240" cy="100" r="95" />
      <circle cx="360" cy="100" r="95" /><circle cx="470" cy="150" r="85" /><circle cx="90" cy="250" r="70" />
      <circle cx="510" cy="250" r="70" /><circle cx="190" cy="290" r="70" /><circle cx="410" cy="290" r="70" />
    </>
  );
  const folds = ["M60 150 q22 -34 56 -14", "M150 62 q30 -14 52 8", "M398 70 q30 -14 52 8", "M484 136 q34 -20 56 14", "M52 262 q20 28 50 18", "M498 280 q26 10 50 -18", "M150 335 q26 18 54 2", "M396 337 q28 16 54 -2"];

  return (
    <div className="max-w-md mx-auto mb-4">
      <div className="cloud-wrap relative w-full">
        <svg viewBox="-8 -10 616 420" className="w-full block" aria-hidden="true">
          <rect x="268" y="320" width="64" height="76" rx="26" fill="#fff" stroke="#ec4899" strokeWidth="9" className="cloud-outline" />
          <g className="cloud-outline" fill="#ec4899" stroke="#ec4899" strokeWidth="9">{shapes}</g>
          <g fill="#fff">{shapes}</g>
          <g fill="none" stroke="#f9a8d4" strokeWidth="6" strokeLinecap="round">
            <path d="M300 28 V86" stroke="#ec4899" />
            {folds.map((d, i) => <path key={i} d={d} />)}
          </g>
        </svg>
        <div className="absolute left-0 right-0 flex flex-col items-center justify-center text-center" style={{ top: "30%", height: "46%" }}>
          <p className="drill-lab font-extrabold uppercase text-amber-800" style={{ letterSpacing: "0.14em" }}>🎧 Today's Strata Laureate</p>
          <div className={`drill-bars flex items-center my-1.5 sm:my-2 ${playing ? "on" : ""}`}>{bars}</div>
          <div className="flex items-center justify-center gap-2">
            {btn("scenario", "Facts")}
            {btn("question", "Question")}
          </div>
          <p className="drill-sub font-semibold text-slate-700 mt-1.5">
            {playing ? (current === "scenario" ? "Playing: facts" : "Playing: question") : heard.scenario && heard.question ? "Replay anytime" : "Facts first, then question"}
          </p>
        </div>
      </div>
      {audioError && <p className="text-sm text-rose-700 text-center mt-2">{audioError}</p>}
    </div>
  );
}

function DailyDrill() {
  const [drill, setDrill] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [name, setName] = useState("");
  const [role, setRole] = useState("");
  const [company, setCompany] = useState("");
  const [drillAnswers, setDrillAnswers] = useState({});
  const [fieldErrors, setFieldErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);
  const [result, setResult] = useState(null);
  const [winners, setWinners] = useState(null);
  const [winnersError, setWinnersError] = useState(null);
  const [winnersDate, setWinnersDate] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const q = await api("/api/drill/today");
        if (cancelled) return;
        setDrill(q);
        try {
          const cached = localStorage.getItem(`drillResult_${q.drillDate}`);
          if (cached) setResult(JSON.parse(cached));
        } catch {}
      } catch (e) {
        if (!cancelled) setLoadError(e.message);
      }
    })();
    return () => { cancelled = true; };
  }, [reloadKey]);

  // Task not launched yet: keep checking, so the page unlocks by itself
  // the moment it goes live.
  useEffect(() => {
    if (!drill || !drill.locked) return;
    const id = setInterval(() => setReloadKey((k) => k + 1), 10000);
    return () => clearInterval(id);
  }, [drill]);

  // Winners are judged by hand and can land any time, so keep polling —
  // not just a once-off load like the old auto-marked leaderboard.
  const drillDay = drill ? drill.drillDate : null;
  const drillLocked = drill ? drill.locked : null;
  useEffect(() => {
    if (!drillDay) return;
    let cancelled = false;
    const load = async () => {
      try {
        // No date: the server sends today's winners once today's task is
        // live, otherwise the last drill's — so they stay up until the
        // next task goes live.
        const r = await api("/api/drill/winners");
        if (!cancelled) { setWinners(r.entries); setWinnersDate(r.drillDate); }
      } catch (e) {
        if (!cancelled) setWinnersError(e.message);
      }
    };
    load();
    const id = setInterval(load, 20000);
    return () => { cancelled = true; clearInterval(id); };
  }, [drillDay, drillLocked]);

  const setAnswer = (taskId, text) => setDrillAnswers((a) => ({ ...a, [taskId]: text }));

  const submit = async () => {
    const errs = {};
    if (!name.trim()) errs.name = true;
    if (!company.trim()) errs.company = true;
    const answers = drill.tasks.map((t) => ({ taskId: t.id, text: (drillAnswers[t.id] || "").trim() }));
    if (answers.some((a) => !a.text)) errs.answers = true;
    if (Object.keys(errs).length > 0) {
      setFieldErrors(errs);
      setSubmitError(errs.answers ? "Please write your answer before submitting." : "Please fill in the fields marked in red.");
      return;
    }
    setFieldErrors({});
    setSubmitError(null);
    setSubmitting(true);
    try {
      const r = await api("/api/drill/submit", {
        method: "POST",
        body: JSON.stringify({ name: name.trim(), role: role.trim(), company: company.trim(), answers }),
      });
      setResult(r);
      try { localStorage.setItem(`drillResult_${r.drillDate}`, JSON.stringify(r)); } catch {}
    } catch (e) {
      setSubmitError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  if (loadError) {
    return <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">Couldn't load today's drill: {loadError}</div>;
  }
  if (!drill) {
    return <div className="text-center text-slate-900 py-16">Loading today's drill…</div>;
  }

  const dp = drillDateParts(drill.drillDate);
  const isWeekend = dp.dow === 0 || dp.dow === 6;
  const wp = drillDateParts(winnersDate || drill.drillDate);
  const winnersAreToday = !!winnersDate && winnersDate === drill.drillDate;
  const dayGap = winnersDate ? Math.round((new Date(drill.drillDate + "T00:00:00Z") - new Date(winnersDate + "T00:00:00Z")) / 86400000) : 0;
  const winnerHeading = winnersAreToday ? "Today's Strata Laureate" : (!winnersDate || dayGap === 1) ? "Yesterday's Strata Laureate" : dayGap <= 3 ? `${DRILL_DAYS_LONG[wp.dow]}'s Strata Laureate` : "Last Strata Laureate";
  const shareText = `Hey mate, this came through on our work Teams and I know you're a strata genius. You should enter!`;

  return (
    <div className="max-w-xl mx-auto space-y-5">
      <div className="text-center">
        <h2 className="font-serif text-xl sm:text-3xl font-bold"><span className="brain-pulse">🧠</span> Strata Laureate</h2>
        <p className="text-xs sm:text-sm font-semibold italic text-slate-600 mb-1.5">The daily test of strata expertise.</p>
        <p className="font-serif text-lg sm:text-3xl font-bold text-slate-900 leading-tight">
          {DRILL_DAYS_LONG[dp.dow]} {dp.d} {DRILL_MONTHS_LONG[dp.m]}
        </p>
        <div className="flex items-center justify-center gap-1.5 mt-2 sm:mt-3">
          {[1, 2, 3, 4, 5].map((n) => (
            <span
              key={n}
              title={DRILL_DAYS_LONG[n]}
              className={`w-7 h-7 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-xs sm:text-sm font-extrabold border-2 ${
                dp.dow === n ? "bg-amber-400 border-slate-900 text-slate-900 shadow-md" : "bg-slate-900 border-slate-900 text-stone-200"
              }`}
            >
              {DRILL_DAYS_SHORT[n][0]}
            </span>
          ))}
        </div>
        <p className="text-[11px] sm:text-sm font-extrabold uppercase tracking-wide text-slate-900 mt-2">Runs Monday to Friday · new task 9am Brisbane time</p>
      </div>

      <DrillInfoButton />

      <div className="bg-gradient-to-br from-amber-50 to-amber-100 border-2 border-amber-300 rounded-2xl px-4 py-3 flex items-center justify-center gap-x-2 gap-y-1 flex-wrap text-center shadow-sm">
        <span className="text-base">🏆</span>
        <span className="font-extrabold text-sm sm:text-base text-slate-900">Today's most thorough answer wins a</span>
        <img src="/prizes/dan-murphys.jpg" alt="Dan Murphy's" className="h-7 sm:h-9 inline-block" onError={(e) => { e.target.style.display = "none"; }} />
        <span className="font-extrabold text-sm sm:text-base text-slate-900">$20 voucher!</span>
      </div>


      {drill.locked ? (
        <div className="bg-white border border-slate-400 rounded-2xl p-5 sm:p-6 shadow-sm text-center">
          <p className="font-serif text-xl font-bold text-slate-900">{isWeekend ? "Strata Laureate is back Monday at 9am" : "Today's task goes live at 9am"}</p>
          <p className="text-base text-slate-900 mt-2">{isWeekend ? "It runs Monday to Friday — see you then." : "Come back then."}</p>
          <DrillSponsorLine sponsor={drill.sponsor} className="mt-4" />
        </div>
      ) : result ? (
        <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm text-center">
          <p className="font-serif text-xl font-bold text-teal-900">Submitted! 🎉</p>
          <p className="text-sm text-slate-900 mt-2">Your answer is in. QSR reads every answer and crowns the most thorough one today's Strata Laureate. Check back below.</p>
          <DrillSponsorLine sponsor={drill.sponsor} className="mt-4" />
          <DrillShareButton text={shareText} />
        </div>
      ) : (
        <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm space-y-5">
          {drill.tasks.map((t, i) => (
            <div key={t.id} className={i > 0 ? "border-t border-slate-100 pt-4" : ""}>
              <DrillAudioBrain />
              <DrillSponsorLine sponsor={drill.sponsor} className="-mt-1 mb-4" />
              <textarea
                value={drillAnswers[t.id] || ""}
                onChange={(e) => setAnswer(t.id, e.target.value)}
                rows={drill.tasks.length === 1 ? 7 : 4}
                placeholder="Write your answer…"
                className={`w-full rounded px-3 py-2 text-base text-slate-900 placeholder-slate-500 border ${fieldErrors.answers && !(drillAnswers[t.id] || "").trim() ? "border-rose-400" : "border-slate-400"}`}
              />
            </div>
          ))}

          <div className="space-y-3 border-t border-slate-100 pt-4">
            <p className="text-sm font-semibold text-slate-900">Who's answering?</p>
            <div>
              <label className={`block text-sm mb-1 ${fieldErrors.name ? "text-rose-600 font-medium" : "text-slate-800"}`}>Name</label>
              <input value={name} onChange={(e) => setName(e.target.value)} className={`w-full rounded px-3 py-2 text-base sm:text-sm border ${fieldErrors.name ? "border-rose-400" : "border-slate-400"}`} />
            </div>
            <div>
              <label className="block text-sm mb-1 text-slate-800">Role</label>
              <input value={role} onChange={(e) => setRole(e.target.value)} placeholder="e.g. Strata Manager" className="w-full rounded px-3 py-2 text-base sm:text-sm border border-slate-400" />
            </div>
            <div>
              <label className={`block text-sm mb-1 ${fieldErrors.company ? "text-rose-600 font-medium" : "text-slate-800"}`}>Strata company</label>
              <input value={company} onChange={(e) => setCompany(e.target.value)} className={`w-full rounded px-3 py-2 text-base sm:text-sm border ${fieldErrors.company ? "border-rose-400" : "border-slate-400"}`} />
            </div>
          </div>

          {submitError && <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{submitError}</div>}

          <button
            onClick={submit}
            disabled={submitting}
            className="gold-pulse-ring w-full bg-amber-500 text-slate-900 font-bold px-5 py-3 rounded-lg text-sm hover:bg-amber-400 disabled:opacity-50"
          >
            {submitting ? "Sending…" : drill.tasks.length === 1 ? "Submit Answer" : "Submit Answers"}
          </button>
        </div>
      )}

      <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6">
        <p className="font-serif text-xl font-bold text-slate-900 text-center">🏆 {winnerHeading}</p>
        {winnersDate && (
          <>
            <p className="font-serif text-lg font-bold text-amber-800 text-center leading-tight">
              {DRILL_DAYS_LONG[wp.dow]} {wp.d} {DRILL_MONTHS_LONG[wp.m]}
            </p>
            <p className="text-xs font-extrabold uppercase tracking-wide text-slate-900 text-center mb-3">
              {winnersAreToday ? "Today's challenge" : "Today's winner announced soon"}
            </p>
          </>
        )}
        {winnersError ? (
          <p className="text-sm text-rose-600 text-center">Couldn't load the board right now.</p>
        ) : !winners ? (
          <p className="text-sm text-slate-900 text-center">Loading…</p>
        ) : winners.length === 0 ? (
          <p className="text-sm text-slate-900 text-center">Winner announced when someone nails it, or when no one does</p>
        ) : (
          <>
            <div>
              {winners.slice(0, 1).map((e, i) => {
                const initials = e.name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
                return (
                  <div key={i} className="rounded-3xl overflow-hidden border-4 border-amber-400 shadow-lg bg-gradient-to-b from-amber-100 to-amber-200">
                    <div className="relative">
                      {e.photoUrl ? (
                        <img src={e.photoUrl} alt={e.name} className="w-full aspect-square object-cover object-top block" />
                      ) : (
                        <div className="w-full aspect-square bg-amber-500 text-white font-extrabold flex items-center justify-center" style={{ fontSize: "5rem" }}>{initials}</div>
                      )}
                      <span className="absolute top-3 left-3 bg-amber-400 text-slate-900 font-extrabold text-xs uppercase tracking-wide px-3 py-1.5 rounded-full shadow">🥇 Strata Laureate</span>
                    </div>
                    <div className="px-5 pt-4 pb-5 text-center">
                      <p className="font-serif text-3xl font-bold text-slate-900 leading-tight break-words">{e.name}</p>
                      {e.role && <p className="text-base font-semibold text-slate-800 mt-1 break-words">{e.role}</p>}
                      {e.logoUrl && (
                        <div className="bg-white rounded-2xl mt-4 px-4 py-3 flex items-center justify-center">
                          <img src={e.logoUrl} alt={e.company} className="h-20 sm:h-24 max-w-full object-contain" />
                        </div>
                      )}
                      <p className="text-base font-extrabold text-amber-900 mt-3 break-words">Flying the flag for {e.company}</p>
                      <WinningAnswer entry={e} />
                    </div>
                  </div>
                );
              })}
            </div>

          </>
        )}
      </div>
    </div>
  );
}

    () => {

      if (!managerName.trim()) errs.managerName = true;
      if (!agency.trim()) errs.agency = true;
      return errs;
    },
    () => {
      const errs = {};
      if (!suburb.trim()) errs.suburb = true;
      if (!lotCount) errs.lotCount = true;
      if (!schemeName.trim()) errs.schemeName = true;
      return errs;
    },
    () => {
      const errs = {};
      if (!winType) errs.winType = true;

      return errs;
    },
  ];
  const stepLabels = ["Manager", "Scheme", "Deal"];

  const goNext = () => {

      setFieldErrors(errs);
      setError("Please fill in the fields marked in red.");
      return;

    setError(null);
    setStep((s) => Math.min(2, s + 1));

    if (!suburb.trim()) errs.suburb = true;

    if (!winType) errs.winType = true;
    if (!newTerm) errs.newTerm = true;
    if (winType === "renewal" && !prevTerm) errs.prevTerm = true;

    if (Object.keys(errs).length > 0) {
      setFieldErrors(errs);
      setError("Please fill in the fields marked in red.");
      return;
    }
    setFieldErrors({});

    setSubmitting(true);
    setError(null);
    try {
      const result = await api("/api/events", {
        method: "POST",
        body: JSON.stringify({
          tipSource,
          managerId: null,
          managerName,
          agency,
          schemeId: null,
          suburb,
          lotCount,
          schemeName,
          type: winType,
          newTerm,
          prevTerm: winType === "renewal" ? prevTerm : undefined,
          date,
          source: "public",
        }),
      });

      await refresh();
      setTipSource("");
      setManagerName(""); setAgency("");
      setSuburb(""); setLotCount(""); setSchemeName("");
      setWinType(""); setNewTerm(""); setPrevTerm(""); setDate(todayStr());
      setStep(0);
      setConfirmation({ points: result.event.points, label: `Logged for ${result.manager.name} — worth ${result.event.points} points once we've confirmed it with them directly.` });
    } catch (e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="max-w-lg space-y-4">
      <h2 className="font-serif text-2xl mb-2">Know about a deal? Tell us.</h2>

      <div className="flex items-center justify-center gap-2">
        {[0, 1, 2].map((i) => (
          <div key={i} className={`h-2 rounded-full transition-all ${i === step ? "w-8 bg-amber-500" : i < step ? "w-2 bg-amber-300" : "w-2 bg-slate-200"}`}></div>
        ))}
      </div>
      <p className="text-center text-xs text-slate-400">Step {step + 1} of 3 — {stepLabels[step]}</p>

      {step === 0 && (
        <>
          <div>
            <p className="text-sm font-semibold text-slate-900 mb-2">Tap the one that fits:</p>
            <div className="flex flex-col gap-2">
              {Object.entries(TIP_SOURCES).map(([key, entry]) => {
                const selected = tipSource === key;
                return (
                  <button
                    key={key}
                    type="button"
                    onClick={() => setTipSource(key)}
                    style={{
                      background: selected ? entry.tint : "#ffffff",
                      border: `2px solid ${selected ? entry.ring : "#e2e8f0"}`,
                    }}
                    className="flex items-center gap-3 rounded-2xl px-3.5 py-3 text-left"
                  >
                    <span
                      style={{ background: entry.color, boxShadow: `0 0 0 3px ${entry.tint}` }}
                      className="w-3.5 h-3.5 rounded-full shrink-0"
                    />
                    <span className="flex-1">
                      <span className="block text-sm font-extrabold text-slate-900">{entry.label}</span>
                      <span className="block text-xs text-slate-500 mt-0.5">{entry.hint}</span>
                    </span>
                    {selected && (
                      <span
                        style={{ background: entry.ring }}
                        className="w-6 h-6 rounded-full text-white text-xs flex items-center justify-center shrink-0"
                      >
                        ✓
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="space-y-4">
            <div><label className={labelClass("managerName")}>Strata Manager (name)</label><input value={managerName} onChange={(e) => setManagerName(e.target.value)} className={inputClass("managerName")} /></div>
            <div><label className={labelClass("agency")}>Strata Company</label><input value={agency} onChange={(e) => setAgency(e.target.value)} className={inputClass("agency")} /></div>
          </div>
        </>
      )}

      {step === 1 && (
        <div className="space-y-4">
          <div><label className={labelClass("suburb")}>Suburb (where the scheme is located)</label><input value={suburb} onChange={(e) => setSuburb(e.target.value)} placeholder="e.g. New Farm" className={inputClass("suburb")} /></div>
          <div><label className={labelClass("lotCount")}>Number of lots</label><input type="number" min="1" value={lotCount} onChange={(e) => setLotCount(e.target.value)} className={inputClass("lotCount")} /></div>
          <div>
            <label className={labelClass("schemeName") + " flex items-center"}>
              Scheme name
              <InfoTooltip text="Never published. We use it to track down the manager and check the deal with them before it goes on the board." />
            </label>
            <input value={schemeName} onChange={(e) => setSchemeName(e.target.value)} className={inputClass("schemeName")} />
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="space-y-4">
          <div>
            <label className={labelClass("winType")}>How was this scheme secured?</label>
            <select value={winType} onChange={(e) => { setWinType(e.target.value); setPrevTerm(""); }} className={selectClass("winType")}>
              <option value="">Select…</option>
              <option value="competitor">Signed from a competitor</option>
              <option value="renewal">Renewed</option>
            </select>
          </div>

          <div>
            <label className={labelClass("newTerm")}>New term (years)</label>
            <select value={newTerm} onChange={(e) => setNewTerm(e.target.value)} className={selectClass("newTerm")}>
              <option value="">Select…</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>

          {winType === "renewal" && (
            <div>
              <label className={labelClass("prevTerm")}>Previous term (years)</label>
              <select value={prevTerm} onChange={(e) => setPrevTerm(e.target.value)} className={selectClass("prevTerm")}>
                <option value="">Select…</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>
          )}

          {winType && newTerm && (winType !== "renewal" || prevTerm) && (
            <div className="bg-amber-400 border-2 border-amber-500 rounded-lg px-4 py-3 text-center shadow-sm">
              <span className="text-black font-extrabold text-lg">
                Worth {previewPoints} point{previewPoints === 1 ? "" : "s"}
              </span>
            </div>
          )}

          <div>
            <label className="block text-sm text-slate-600 mb-1">Date of deal</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} max={todayStr()} className="w-full border border-slate-300 rounded px-3 py-2 text-sm" />
          </div>
        </div>
      )}

      <div className="flex gap-2 pt-2">
        {step > 0 && (
          <button onClick={goBack} className="border border-slate-300 text-slate-700 font-medium px-5 py-2.5 rounded-lg text-sm hover:bg-slate-50">
            Back
          </button>
        )}
        {step < 2 ? (
          <button onClick={goNext} className="bg-amber-500 text-slate-900 font-medium px-5 py-2.5 rounded-lg text-sm hover:bg-amber-400">
            Next
          </button>
        ) : (
          <button onClick={submit} disabled={submitting} className="gold-pulse-ring bg-amber-500 text-slate-900 font-bold px-5 py-2.5 rounded-lg text-sm hover:bg-amber-400 disabled:opacity-50">
            {submitting ? "Sending…" : "Submit"}
          </button>
        )}
      </div>
      {error && <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      {confirmation && (
        <div className="bg-gradient-to-br from-teal-50 to-emerald-50 border-2 border-teal-300 rounded-xl p-5 text-center shadow-md">
          <p className="text-3xl mb-2">🎉</p>
          <p className="font-serif text-xl font-bold text-teal-900 mb-1">Thanks for the scoop.</p>
          <p className="text-sm text-teal-800">{confirmation.label}</p>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
<script>
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, { presets: [["react", { runtime: "classic" }]] }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = compiled;
  document.body.appendChild(scriptEl);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
