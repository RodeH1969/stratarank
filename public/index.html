const { useState, useEffect, useMemo } = React;

const emptyData = { managers: [], schemes: [], events: [], sponsors: [], sponsorInvites: [], agencyLogos: {}, seasonYear: new Date().getFullYear() };

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayStr = () => new Date().toISOString().slice(0, 10);
const yearOf = (dateStr) => new Date(dateStr).getFullYear();
const BCCM_MODULES = [
  "Standard Module",
  "Accommodation Module",
  "Commercial Module",
  "Small Schemes Module",
  "Specified Two-lot Schemes Module",
];
const schemeLabel = (scheme) => {
  if (!scheme) return "Building";
  const parts = [scheme.suburb, scheme.planType, scheme.module, scheme.lotCount ? `${scheme.lotCount} lots` : null].filter(Boolean);
  return parts.length ? parts.join(" · ") : "Building";
};
const formatDate = (dateStr) => {
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
};
function computePoints(type, newTerm, prevTerm) {
  const t = Number(newTerm);
  const p = prevTerm != null && prevTerm !== "" ? Number(prevTerm) : null;
  if (type === "competitor") {
    if (t === 3) return 10;
    if (t === 2) return 9;
    if (t === 1) return 8;
    return 0;
  }
  if (type === "renewal") {
    if (t === 3) {
      if (p === 1 || p === 2) return 7;
      if (p === 3) return 3;
      return 0;
    }
    if (t === 2) return 2;
    if (t === 1) return 1;
    return 0;
  }
  return 0;
}

async function api(path, options) {
  // Render's containers occasionally take a minute or two to fully settle
  // right after a fresh deploy, which can cause a brief run of server-side
  // failures. Retry those silently with backoff before ever surfacing an
  // error — but never retry a genuine validation error (4xx), since that's
  // real input feedback the person needs to see immediately.
  const maxAttempts = 6;
  let delay = 2000;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    let res;
    try {
      res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options && options.headers) },
      });
    } catch (networkErr) {
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, delay));
        delay = Math.min(delay * 2, 20000);
        continue;
      }
      throw networkErr;
    }
    const body = await res.json().catch(() => ({}));
    if (res.ok) return body;
    const message = body.error || `Request failed (${res.status})`;
    if (res.status >= 500 && attempt < maxAttempts) {
      await new Promise((r) => setTimeout(r, delay));
      delay = Math.min(delay * 2, 20000);
      continue;
    }
    throw new Error(message);
  }
}

                  <td className="py-2 text-right font-semibold text-slate-900">9</td>
                </tr>
                <tr className="border-b border-slate-100">
                  <td className="py-2 pr-3 text-slate-700">Signed from a competitor — 1 year term</td>
                  <td className="py-2 text-right font-semibold text-slate-900">8</td>
                </tr>
                <tr className="border-b border-slate-100">
                  <td className="py-2 pr-3 text-slate-700">Renewed to a 3 year term (was 1 or 2 years)</td>
                  <td className="py-2 text-right font-semibold text-slate-900">7</td>
                </tr>
                <tr className="border-b border-slate-100">
                  <td className="py-2 pr-3 text-slate-700">Renewed to a 3 year term (was 3 years)</td>
                  <td className="py-2 text-right font-semibold text-slate-900">3</td>

                </tr>
                <tr>
                  <td className="py-2 pr-3 text-slate-700">Renewed to a 1 year term</td>

              </tbody>

          </div>

}

  return (

        i

      {open && (
        <div className="absolute z-20 left-1/2 -translate-x-1/2 top-full mt-2 w-60 bg-slate-900 text-white text-xs rounded-lg p-3 shadow-lg">
          {text}

function App() {
  const [data, setData] = useState(emptyData);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [tab, setTab] = useState("rankings");

  const refresh = async () => {
    try {
      const fresh = await api("/api/data");
      setData(fresh);
      setLoadError(null);
    } catch (e) {
      setLoadError(e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { refresh(); }, []);

  const managerById = (id) => data.managers.find((m) => m.id === id);
  const schemeById = (id) => data.schemes.find((s) => s.id === id);

  const standings = useMemo(() => {
    const totals = {};
    for (const m of data.managers) {
      totals[m.id] = { manager: m, points: 0, events: 0, competitorWins: 0, renewals: 0, lots: 0 };
    }
    for (const ev of data.events) {
      if (yearOf(ev.date) !== data.seasonYear) continue;
      if (!totals[ev.managerId]) continue;
      totals[ev.managerId].points += ev.points;
      totals[ev.managerId].events += 1;
      if (ev.type === "competitor") totals[ev.managerId].competitorWins += 1;
      if (ev.type === "renewal") totals[ev.managerId].renewals += 1;
      const scheme = schemeById(ev.schemeId);
      if (scheme?.lotCount) totals[ev.managerId].lots += Number(scheme.lotCount) || 0;
    }
    return Object.values(totals)
      .filter((row) => row.events > 0)
      .sort((a, b) => b.points - a.points || b.lots - a.lots);
  }, [data]);

  const sortedEvents = useMemo(
    () => [...data.events].filter((e) => yearOf(e.date) === data.seasonYear).sort((a, b) => new Date(b.date) - new Date(a.date)),
    [data]
  );

  return (
    <div className="min-h-screen bg-stone-50 text-slate-900">
      <div className="max-w-3xl mx-auto px-6 py-10">
        <header className="border-b-2 border-slate-900 pb-5 mb-8">
          <div className="mb-4">
            <h1 className="font-serif text-3xl sm:text-4xl md:text-5xl leading-tight">QLD Strata Rankings <span className="text-amber-500">{data.seasonYear}</span></h1>
            <p className="text-slate-800 mt-3 font-semibold text-base sm:text-lg leading-snug">
              Community Managers across Qld ranked by <span className="text-amber-600">1 metric</span>: contract endorsements from committees.
            </p>
          </div>
          <nav className="flex gap-1 bg-slate-900 rounded-full p-1 overflow-x-auto">
            {[
              { id: "rankings", label: "Rankings" },
              { id: "log", label: "Recent wins" },
              { id: "report", label: "Nominate a win" },
            ].map(({ id, label }) => (
              <button
                key={id}
                onClick={() => setTab(id)}
                className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-full text-xs sm:text-sm font-medium whitespace-nowrap transition-colors ${tab === id ? "bg-amber-500 text-slate-900" : "text-stone-200 hover:text-white"}`}
              >
                {label}
              </button>
            ))}
          </nav>
        </header>

        {loadError && (
          <div className="mb-6 bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">
            Couldn't reach the rankings server: {loadError}
          </div>
        )}

        {loading ? (
          <p className="text-slate-500">Loading rankings…</p>
        ) : tab === "rankings" ? (
          <Rankings standings={standings} sponsors={data.sponsors} agencyLogos={data.agencyLogos} seasonYear={data.seasonYear} />
        ) : tab === "log" ? (
          <EventLog events={sortedEvents} managerById={managerById} schemeById={schemeById} agencyLogos={data.agencyLogos} sponsorInvites={data.sponsorInvites} />
        ) : (
          <ReportWin data={data} refresh={refresh} />
        )}
      </div>
    </div>
  );
}

function ManagerPhotoPopup({ manager, children }) {
  const [open, setOpen] = useState(false);
  if (!manager) return children;
  const initials = (manager.name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  return (
    <>
      <button type="button" onClick={() => setOpen(true)} className="text-left min-w-0">
        {children}
      </button>
      {open && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" onClick={() => setOpen(false)}>
          <div className="bg-white rounded-xl shadow-xl max-w-xs w-full p-6 text-center relative" onClick={(e) => e.stopPropagation()}>
            <button onClick={() => setOpen(false)} aria-label="Close" className="absolute top-3 right-3 text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
            {manager.photoUrl ? (
              <img src={manager.photoUrl} alt={manager.name} className="w-32 h-32 rounded-full object-cover mx-auto mb-4 border-4 border-amber-100" />
            ) : (
              <div className="w-32 h-32 rounded-full bg-slate-200 flex items-center justify-center mx-auto mb-4 text-3xl font-bold text-slate-500">
                {initials}
              </div>
            )}
            <h3 className="font-serif text-xl">{manager.name}</h3>
            {manager.agency && <p className="text-sm text-slate-500 mt-1">{manager.agency}</p>}
            {manager.linkedinUrl && (
              <a
                href={manager.linkedinUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-1.5 mt-3 text-sm font-medium text-[#0A66C2] hover:underline"
              >
                View on LinkedIn ↗
              </a>
            )}
          </div>
        </div>
      )}
    </>
  );
}

function AgencyBadge({ agency, agencyLogos }) {
  if (!agency) return null;
  const key = agency.trim().toLowerCase();
  const match = (agencyLogos || {})[key];

  if (match && match.logoUrl) {
    const logo = <img src={match.logoUrl} alt={agency} className="h-6 w-auto object-contain shrink-0" />;
    return match.websiteUrl ? (
      <a href={match.websiteUrl} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="shrink-0 hover:opacity-80 transition-opacity">
        {logo}
      </a>
    ) : logo;
  }
  const initials = agency.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  return (
    <div className="h-6 min-w-6 px-1.5 rounded bg-slate-200 text-slate-600 text-[10px] font-medium flex items-center justify-center shrink-0">
      {initials}
    </div>
  );
}

function SponsorStrip({ sponsors }) {
  const active = (sponsors || []).filter((s) => s.active !== false);
  if (!active.length) return null;
  return (
    <div className="mb-10 border-y border-slate-200 py-8">
      <div className="text-sm text-slate-500 text-center mb-5">Rankings brought to you by:</div>
      <div className="flex flex-wrap items-center justify-center gap-10">
        {active.map((s) => {
          const content = s.logoUrl
            ? <img src={s.logoUrl} alt={s.name} className="max-h-20 max-w-40 object-contain" />
            : <span className="font-medium text-slate-600">{s.name}</span>;
          return (
            <div key={s.id} className="h-20 w-40 flex items-center justify-center">
              {s.websiteUrl ? (
                <a href={s.websiteUrl} target="_blank" rel="noopener noreferrer" className="h-full w-full flex items-center justify-center hover:opacity-80 transition-opacity">
                  {content}
                </a>
              ) : content}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Rankings({ standings, sponsors, agencyLogos, seasonYear }) {
  return (
    <div>
      <PointsInfoButton />
      {standings.length === 0 ? (
        <p className="text-slate-500 text-center py-16">No wins reported yet for {seasonYear}.</p>
      ) : (
        standings.map((row, i) => (
          <div key={row.manager.id} className={`flex flex-wrap items-center gap-x-4 gap-y-2 py-4 border-b border-slate-200 ${i === 0 ? "bg-amber-50 -mx-4 px-4 rounded-lg border-b-0" : ""}`}>
            <div className="w-8 sm:w-10 text-center font-serif text-xl sm:text-2xl text-slate-400 shrink-0">{i === 0 ? <span className="text-base sm:text-lg font-semibold text-amber-600">1st</span> : i + 1}</div>
            <div className="flex-1 min-w-0 flex items-center gap-2.5">
              <AgencyBadge agency={row.manager.agency} agencyLogos={agencyLogos} />
              <ManagerPhotoPopup manager={row.manager}>
                <div className="min-w-0">
                  <p className="font-medium truncate hover:underline decoration-dotted">{row.manager.name}</p>
                  {row.manager.agency && <p className="text-sm text-slate-500 truncate">{row.manager.agency}</p>}
                </div>
              </ManagerPhotoPopup>
            </div>
            <div className="basis-full sm:basis-auto text-right sm:shrink-0 pl-12 sm:pl-0">
              <div className="flex items-baseline justify-end gap-2 flex-wrap">
                <span className="font-serif text-2xl sm:text-3xl">{row.points}</span>
                <span className="text-xs sm:text-sm font-bold text-slate-700 whitespace-nowrap">
                  ({row.events} win{row.events === 1 ? "" : "s"} · {row.lots} lot{row.lots === 1 ? "" : "s"})
                </span>
              </div>
            </div>
          </div>
        ))
      )}
      <SponsorStrip sponsors={sponsors} />
    </div>
  );
}

function EventLog({ events, managerById, schemeById, agencyLogos, sponsorInvites }) {
  const findWinSponsors = (eventId) =>
    (sponsorInvites || []).filter((inv) => inv.eventId === eventId && inv.status === "accepted" && inv.logoUrl).slice(0, 5);
  return (
    <div>
      <PointsInfoButton />
      {events.length === 0 ? (
        <p className="text-slate-500 text-center py-16">No wins reported yet.</p>
      ) : (
        <div className="space-y-4">
          {events.map((ev) => {
            const manager = managerById(ev.managerId);
            const scheme = schemeById(ev.schemeId);
            const sponsors = findWinSponsors(ev.id);
            return (
              <div key={ev.id} className="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 shadow-sm hover:shadow-md transition-shadow">
                <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 sm:gap-4">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <AgencyBadge agency={manager?.agency} agencyLogos={agencyLogos} />
                    <ManagerPhotoPopup manager={manager}>
                      <div className="min-w-0">
                        <p className="font-semibold text-base text-slate-900 truncate hover:underline decoration-dotted">{manager?.name || "Unknown"}</p>
                        {manager?.agency && <p className="text-sm text-slate-500 truncate">{manager.agency}</p>}
                      </div>
                    </ManagerPhotoPopup>
                  </div>

                  <div className="sm:flex-1 sm:min-w-[140px]">
                    <p className="text-base font-semibold text-slate-800">{scheme?.suburb || "Building"}</p>
                    <p className="text-sm text-slate-500 mt-0.5">{[scheme?.planType, scheme?.module].filter(Boolean).join(" · ")}</p>
                    {scheme?.lotCount ? <p className="text-sm text-slate-500 mt-0.5">{scheme.lotCount} lots</p> : null}
                  </div>

                  <div className="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-start gap-2 sm:shrink-0">
                    <div className="bg-teal-50 text-teal-700 font-serif font-bold text-lg px-3.5 py-1 rounded-full">
                      +{ev.points}
                    </div>
                    <span className="text-xs sm:text-sm font-semibold text-white bg-indigo-500 px-2.5 py-1 rounded-full whitespace-nowrap">
                      {formatDate(ev.date)}
                    </span>
                  </div>
                </div>

                {sponsors.length > 0 && (
                  <div className="mt-4 pt-3 border-t border-slate-100">
                    <p className="text-sm font-bold text-black text-center mb-2.5">Top Trades</p>
                    <div className="flex flex-wrap items-center justify-start gap-4">
                      {sponsors.map((s) => {
                        const pair = (
                          <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5">
                            {s.iconUrl && (
                              <img src={s.iconUrl} alt="" className="h-7 w-7 object-contain shrink-0" />
                            )}
                            <img
                              src={s.logoUrl}
                              alt={s.businessName}
                              title={s.tagline ? `${s.businessName} — ${s.tagline}` : s.businessName}
                              className="h-9 max-w-[110px] object-contain"
                            />
                          </div>
                        );
                        return s.websiteUrl ? (
                          <a key={s.id} href={s.websiteUrl} target="_blank" rel="noopener noreferrer" className="hover:opacity-80 transition-opacity">
                            {pair}
                          </a>
                        ) : (
                          <div key={s.id}>{pair}</div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ReportWin({ data, refresh }) {
  const [managerChoice, setManagerChoice] = useState("__new__");
  const [managerName, setManagerName] = useState("");
  const [agency, setAgency] = useState("");
  const [managerPhotoData, setManagerPhotoData] = useState("");
  const [managerPhotoFileName, setManagerPhotoFileName] = useState("");
  const [schemeChoice, setSchemeChoice] = useState("__new__");
  const [suburb, setSuburb] = useState("");
  const [planType, setPlanType] = useState("BFP");
  const [module, setModule] = useState("");
  const [lotCount, setLotCount] = useState("");
  const [schemeName, setSchemeName] = useState("");
  const [cts, setCts] = useState("");
  const [winType, setWinType] = useState("");
  const [newTerm, setNewTerm] = useState("");
  const [prevTerm, setPrevTerm] = useState("");
  const [date, setDate] = useState(todayStr());
  const [tradieBusiness, setTradieBusiness] = useState("");
  const [tradieName, setTradieName] = useState("");
  const [confirmation, setConfirmation] = useState(null);
  const [error, setError] = useState(null);
  const [fieldErrors, setFieldErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);

  const sortedManagers = [...data.managers].sort((a, b) => a.name.localeCompare(b.name));
  const sortedSchemes = [...data.schemes].sort((a, b) => schemeLabel(a).localeCompare(schemeLabel(b)));
  const previewPoints = computePoints(winType, newTerm, prevTerm);

  const labelClass = (key) => `block text-sm mb-1 ${fieldErrors[key] ? "text-rose-600 font-medium" : "text-slate-600"}`;
  const inputClass = (key) => `w-full rounded px-3 py-2 text-sm border ${fieldErrors[key] ? "border-rose-400" : "border-slate-300"}`;
  const selectClass = (key) => `w-full rounded px-3 py-2 text-sm bg-white border ${fieldErrors[key] ? "border-rose-400" : "border-slate-300"}`;

  const submit = async () => {
    const isNewManager = managerChoice === "__new__";
    const isNewScheme = schemeChoice === "__new__";
    const errs = {};
    if (isNewManager && !managerName.trim()) errs.managerName = true;
    if (isNewManager && !agency.trim()) errs.agency = true;
    if (isNewScheme && !suburb.trim()) errs.suburb = true;
    if (isNewScheme && !module.trim()) errs.module = true;
    if (isNewScheme && !lotCount) errs.lotCount = true;
    if (isNewScheme && !schemeName.trim()) errs.schemeName = true;
    if (isNewScheme && !cts.trim()) errs.cts = true;
    if (!winType) errs.winType = true;
    if (!newTerm) errs.newTerm = true;
    if (winType === "renewal" && !prevTerm) errs.prevTerm = true;
    if (!tradieBusiness.trim()) errs.tradieBusiness = true;
    if (!tradieName.trim()) errs.tradieName = true;

    if (Object.keys(errs).length > 0) {
      setFieldErrors(errs);
      setError("Please fill in the fields marked in red.");
      return;
    }
    setFieldErrors({});

    setSubmitting(true);
    setError(null);
    try {
      const result = await api("/api/events", {
        method: "POST",
        body: JSON.stringify({
          managerId: isNewManager ? null : managerChoice,
          managerName: isNewManager ? managerName : undefined,
          agency: isNewManager ? agency : undefined,
          managerPhotoUrl: isNewManager ? managerPhotoData || undefined : undefined,
          schemeId: isNewScheme ? null : schemeChoice,
          suburb: isNewScheme ? suburb : undefined,
          planType: isNewScheme ? planType : undefined,
          module: isNewScheme ? module : undefined,
          lotCount: isNewScheme ? lotCount : undefined,
          schemeName: isNewScheme ? schemeName : undefined,
          cts: isNewScheme ? cts : undefined,
          type: winType,
          newTerm,
          prevTerm: winType === "renewal" ? prevTerm : undefined,
          date,
          source: "public",
          businessName: tradieBusiness.trim(),
          contactName: tradieName.trim(),
        }),
      });

      await refresh();
      setManagerChoice("__new__"); setManagerName(""); setAgency(""); setManagerPhotoData(""); setManagerPhotoFileName("");
      setSchemeChoice("__new__"); setSuburb(""); setModule(""); setLotCount(""); setSchemeName(""); setCts("");
      setWinType(""); setNewTerm(""); setPrevTerm(""); setDate(todayStr());
      setTradieBusiness(""); setTradieName("");
      if (result.inviteError) {
        setError(`Win saved, but the tradie suggestion didn't go through: ${result.inviteError}`);
      }
      setConfirmation({ points: result.event.points, label: `Win reported for ${result.manager.name} — ${result.event.points} points` });
    } catch (e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="max-w-lg space-y-4">
      <h2 className="font-serif text-2xl mb-2">Nominate a win by a Strata Manager</h2>
      <PointsInfoButton />

      {sortedManagers.length > 0 && (
        <div>
          <label className="block text-sm text-slate-600 mb-1">Strata Manager</label>
          <select value={managerChoice} onChange={(e) => setManagerChoice(e.target.value)} className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white">
            <option value="__new__">+ Add new manager…</option>
            {sortedManagers.map((m) => (
              <option key={m.id} value={m.id}>{m.name}{m.agency ? ` · ${m.agency}` : ""}</option>
            ))}
          </select>
        </div>
      )}
      {managerChoice === "__new__" && (
        <div className={sortedManagers.length > 0 ? "pl-3 border-l-2 border-slate-200 space-y-4" : "space-y-4"}>
          <div><label className={labelClass("managerName")}>Manager's name</label><input value={managerName} onChange={(e) => setManagerName(e.target.value)} className={inputClass("managerName")} /></div>
          <div><label className={labelClass("agency")}>Manager's agency</label><input value={agency} onChange={(e) => setAgency(e.target.value)} className={inputClass("agency")} /></div>
          <div>
            <label className="block text-sm text-slate-600 mb-1">Manager's photo (optional)</label>
            <input
              type="file"
              accept="image/png,image/jpeg,image/webp"
              onChange={(e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                  window.alert("Please choose a photo smaller than 2 MB.");
                  e.target.value = "";
                  return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                  setManagerPhotoData(reader.result);
                  setManagerPhotoFileName(file.name);
                };
                reader.readAsDataURL(file);
              }}
              className="w-full border border-slate-300 rounded px-3 py-2 text-sm"
            />
            {managerPhotoFileName && <p className="text-xs text-slate-500 mt-1">Selected: {managerPhotoFileName}</p>}
            {managerPhotoData && (
              <img src={managerPhotoData} alt="Preview" className="mt-2 w-16 h-16 rounded-full object-cover border border-slate-200" />
            )}
          </div>
        </div>
      )}

      {sortedSchemes.length > 0 && (
        <div>
          <label className="block text-sm text-slate-600 mb-1">Scheme</label>
          <select value={schemeChoice} onChange={(e) => setSchemeChoice(e.target.value)} className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white">
            <option value="__new__">+ Add new scheme…</option>
            {sortedSchemes.map((s) => (
              <option key={s.id} value={s.id}>{schemeLabel(s)}</option>
            ))}
          </select>
        </div>
      )}
      {schemeChoice === "__new__" && (
        <div className={sortedSchemes.length > 0 ? "pl-3 border-l-2 border-slate-200 space-y-4" : "space-y-4"}>
          <div><label className={labelClass("suburb")}>Suburb (where the scheme is located)</label><input value={suburb} onChange={(e) => setSuburb(e.target.value)} placeholder="e.g. New Farm" className={inputClass("suburb")} /></div>
          <div>
            <label className="block text-sm text-slate-600 mb-1">Scheme type</label>
            <select value={planType} onChange={(e) => setPlanType(e.target.value)} className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white">
              <option value="BFP">BFP</option>
              <option value="SFP">SFP</option>
            </select>
          </div>
          <div>
            <label className={labelClass("module")}>Module</label>
            <select value={module} onChange={(e) => setModule(e.target.value)} className={selectClass("module")}>
              <option value="">Select…</option>
              {BCCM_MODULES.map((m) => (
                <option key={m} value={m}>{m}</option>
              ))}
            </select>
          </div>
          <div><label className={labelClass("lotCount")}>Number of lots</label><input type="number" min="1" value={lotCount} onChange={(e) => setLotCount(e.target.value)} className={inputClass("lotCount")} /></div>
          <div>
            <label className={labelClass("schemeName") + " flex items-center"}>
              Scheme name
              <InfoTooltip text="We never publish this — it's kept privately so we can verify the win is genuine." />
            </label>
            <input value={schemeName} onChange={(e) => setSchemeName(e.target.value)} className={inputClass("schemeName")} />
          </div>
          <div>
            <label className={labelClass("cts") + " flex items-center"}>
              CTS number
              <InfoTooltip text="We never publish this — it's kept privately so we can verify the win is genuine." />
            </label>
            <input value={cts} onChange={(e) => setCts(e.target.value)} className={inputClass("cts")} />
          </div>
        </div>
      )}

      <div>
        <label className={labelClass("winType")}>How was this scheme secured?</label>
        <select value={winType} onChange={(e) => { setWinType(e.target.value); setPrevTerm(""); }} className={selectClass("winType")}>
          <option value="">Select…</option>
          <option value="competitor">Signed from a competitor</option>
          <option value="renewal">Renewed with us</option>
        </select>
      </div>

      <div>
        <label className={labelClass("newTerm")}>New term (years)</label>
        <select value={newTerm} onChange={(e) => setNewTerm(e.target.value)} className={selectClass("newTerm")}>
          <option value="">Select…</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      {winType === "renewal" && (
        <div>
          <label className={labelClass("prevTerm")}>Previous term (years)</label>
          <select value={prevTerm} onChange={(e) => setPrevTerm(e.target.value)} className={selectClass("prevTerm")}>
            <option value="">Select…</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
      )}

      {winType && newTerm && (winType !== "renewal" || prevTerm) && (
        <div className="bg-amber-400 border-2 border-amber-500 rounded-lg px-4 py-3 text-center shadow-sm">
          <span className="text-black font-extrabold text-lg">
            Worth {previewPoints} point{previewPoints === 1 ? "" : "s"}
          </span>
        </div>
      )}

      <div>
        <label className="block text-sm text-slate-600 mb-1">Date of win</label>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} max={todayStr()} className="w-full border border-slate-300 rounded px-3 py-2 text-sm" />
      </div>

      <div className="pt-2 border-t border-slate-200">
        <p className="text-sm font-medium text-slate-700 mb-1">A tradie or contractor who does great work on this building</p>
        <div className="space-y-3">
          <div>
            <label className={labelClass("tradieBusiness")}>Business name</label>
            <input value={tradieBusiness} onChange={(e) => setTradieBusiness(e.target.value)} placeholder="e.g. Ace Plumbing" className={inputClass("tradieBusiness")} />
          </div>
          <div>
            <label className={labelClass("tradieName")}>Contact name</label>
            <input value={tradieName} onChange={(e) => setTradieName(e.target.value)} className={inputClass("tradieName")} />
          </div>
        </div>
      </div>

      <button onClick={submit} disabled={submitting} className="bg-amber-500 text-slate-900 font-medium px-5 py-2.5 rounded-lg text-sm hover:bg-amber-400 disabled:opacity-50">
        {submitting ? "Saving…" : "Report win"}
      </button>
      {error && <div className="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-700">{error}</div>}
      {confirmation && <div className="bg-teal-50 border border-teal-200 rounded-lg p-3 text-sm text-teal-800">{confirmation.label}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
<script>
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, { presets: [["react", { runtime: "classic" }]] }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = compiled;
  document.body.appendChild(scriptEl);
</script>
</body>
</html>
